---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lodia-lifecycle
rules:
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - lodia.io
  resources:
  - backups
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - lodia.io
  resources:
  - controlplanes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - lodia.io
  resources:
  - controlplanes/status
  verbs:
  - patch
- apiGroups:
  - lodia.io
  resources:
  - datastoreclasses
  verbs:
  - list
  - watch
