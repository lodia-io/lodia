kind: ClusterRole
metadata:
  name: lodia-pki
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - admissionregistration.k8s.io
  resourceNames:
  - kubeconfigrequests.lodia.io
  resources:
  - validatingadmissionpolicies
  - validatingadmissionpolicybindings
  verbs:
  - get
- apiGroups:
  - lodia.io
  resources:
  - controlplanes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - lodia.io
  resources:
  - controlplanes/finalizers
  verbs:
  - update
- apiGroups:
  - lodia.io
  resources:
  - controlplanes/status
  - kubeconfigrequests/status
  verbs:
  - patch
- apiGroups:
  - lodia.io
  resources:
  - kubeconfigrequests
  verbs:
  - delete
  - list
  - watch
