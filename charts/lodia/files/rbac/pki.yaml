---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lodia-pki
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - lodia.io
  resources:
  - controlplanes
  verbs:
  - list
  - watch
- apiGroups:
  - lodia.io
  resources:
  - controlplanes/finalizers
  verbs:
  - update
- apiGroups:
  - lodia.io
  resources:
  - controlplanes/status
  verbs:
  - patch
