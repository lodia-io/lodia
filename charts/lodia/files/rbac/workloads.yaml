---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lodia-workloads
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - create
  - delete
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - list
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - list
  - patch
  - watch
- apiGroups:
  - lodia.io
  resources:
  - controlplanes
  verbs:
  - list
  - watch
- apiGroups:
  - lodia.io
  resources:
  - controlplanes/finalizers
  verbs:
  - update
- apiGroups:
  - lodia.io
  resources:
  - controlplanes/status
  verbs:
  - patch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - list
  - patch
  - watch
