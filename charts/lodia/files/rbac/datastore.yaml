kind: ClusterRole
metadata:
  name: lodia-datastore
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - delete
  - list
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - get
- apiGroups:
  - druid.gardener.cloud
  resources:
  - etcds
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - lodia.io
  resources:
  - controlplanes
  verbs:
  - list
  - patch
  - watch
- apiGroups:
  - lodia.io
  resources:
  - controlplanes/finalizers
