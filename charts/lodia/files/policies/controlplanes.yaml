apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplanes.lodia.io
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [lodia.io]
        apiVersions: ["*"]
        operations: [DELETE]
        resources: [controlplanes]
  validations:
    - expression: >-
        has(namespaceObject.metadata.deletionTimestamp) ||
        oldObject.metadata.?annotations['lodia.io/deletion-confirmed'].orValue('') == 'true'
      messageExpression: >-
        'ControlPlane ' + oldObject.metadata.namespace + '/' + oldObject.metadata.name +
        ' is deleted only once confirmed: kubectl annotate controlplane ' + oldObject.metadata.name +
        ' --namespace ' + oldObject.metadata.namespace + ' --overwrite lodia.io/deletion-confirmed=true'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: controlplanes.lodia.io
spec:
  policyName: controlplanes.lodia.io
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplanes-crd.lodia.io
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apiextensions.k8s.io]
        apiVersions: ["*"]
        operations: [DELETE]
        resources: [customresourcedefinitions]
  # Not resourceNames: each item of a collection's delete reaches admission
  # with an empty name, which resourceNames never matches.
  matchConditions:
    - name: controlplanes-crd
      expression: oldObject.metadata.name == 'controlplanes.lodia.io'
  validations:
    - expression: oldObject.metadata.?annotations['lodia.io/deletion-confirmed'].orValue('') == 'true'
      messageExpression: >-
        'CustomResourceDefinition ' + oldObject.metadata.name +
        ' is deleted only once confirmed, and deleting it takes every ControlPlane with it: kubectl annotate customresourcedefinition ' +
        oldObject.metadata.name + ' --overwrite lodia.io/deletion-confirmed=true'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: controlplanes-crd.lodia.io
spec:
  policyName: controlplanes-crd.lodia.io
  validationActions: [Deny]
