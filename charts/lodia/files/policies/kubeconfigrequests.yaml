apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubeconfigrequests.lodia.io
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [lodia.io]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [kubeconfigrequests]
  validations:
    - expression: object.spec.user == request.userInfo.username
      messageExpression: "'spec.user must be the requester, ' + request.userInfo.username"
      reason: Forbidden
    - expression: >-
        !has(object.spec.access) ||
        authorizer.group('lodia.io').resource('controlplanes').subresource('adminkubeconfig')
        .namespace(object.metadata.namespace).name(object.spec.controlPlaneRef.name)
        .check('create').allowed()
      messageExpression: "request.userInfo.username + ' may not create controlplanes/adminkubeconfig for ' + object.spec.controlPlaneRef.name"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubeconfigrequests.lodia.io
spec:
  policyName: kubeconfigrequests.lodia.io
  validationActions: [Deny]
