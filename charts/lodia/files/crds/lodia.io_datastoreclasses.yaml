---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: datastoreclasses.lodia.io
spec:
  group: lodia.io
  names:
    kind: DatastoreClass
    listKind: DatastoreClassList
    plural: datastoreclasses
    shortNames:
    - dsc
    singular: datastoreclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.storage.className
      name: Storage
      type: string
    - jsonPath: .spec.backup.store.provider
      name: Backups
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DatastoreClass is how a dedicated etcd is built. The class annotated
          lodia.io/is-default-class: "true" serves ControlPlanes that name none.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is how the etcd is built.
            properties:
              backup:
                description: backup is where and how often snapshots go; without it,
                  no backups.
                properties:
                  deltaSnapshotPeriod:
                    default: 5m
                    description: deltaSnapshotPeriod is how often a delta snapshot
                      is taken.
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: must be a duration
                      rule: duration(self) >= duration('0s')
                  fullSnapshotSchedule:
                    default: 0 0 * * *
                    description: |-
                      fullSnapshotSchedule is a cron expression as defragmentation.schedule
                      takes it.
                    maxLength: 64
                    pattern: ^(\*|[1-5]?[0-9]|[1-5]?[0-9]-[1-5]?[0-9]|(?:[1-9]|[1-4][0-9]|5[0-9])\/(?:[1-9]|[1-4][0-9]|5[0-9]|60)|\*\/(?:[1-9]|[1-4][0-9]|5[0-9]|60))\s+(\*|[0-9]|1[0-9]|2[0-3]|[0-9]-(?:[0-9]|1[0-9]|2[0-3])|1[0-9]-(?:1[0-9]|2[0-3])|2[0-3]-2[0-3]|(?:[1-9]|1[0-9]|2[0-3])\/(?:[1-9]|1[0-9]|2[0-4])|\*\/(?:[1-9]|1[0-9]|2[0-4]))\s+(\*|[1-9]|[12][0-9]|3[01]|[1-9]-(?:[1-9]|[12][0-9]|3[01])|[12][0-9]-(?:[12][0-9]|3[01])|3[01]-3[01]|(?:[1-9]|[12][0-9]|30)\/(?:[1-9]|[12][0-9]|3[01])|\*\/(?:[1-9]|[12][0-9]|3[01]))\s+(\*|[1-9]|1[0-2]|[1-9]-(?:[1-9]|1[0-2])|1[0-2]-1[0-2]|(?:[1-9]|1[0-2])\/(?:[1-9]|1[0-2])|\*\/(?:[1-9]|1[0-2]))\s+(\*|[1-7]|[1-6]-[1-7]|[1-6]\/[1-7]|\*\/[1-7])$
                    type: string
                    x-kubernetes-validations:
                    - message: must be five fields separated by single spaces
                      rule: self.matches('^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+$')
                    - message: every range must ascend
                      rule: self.split(' ').all(f, !f.split('/')[0].matches('^[0-9]+-[0-9]+$')
                        || int(f.split('/')[0].split('-')[0]) <= int(f.split('/')[0].split('-')[1]))
                    - message: the day of the week cannot be 7
                      rule: self.split(' ').size() != 5 || !self.split(' ')[4].matches('^(7|[1-6]-7)$')
                  retention:
                    description: retention is how long snapshots are kept.
                    properties:
                      fullSnapshots:
                        default: 30
                        description: |-
                          fullSnapshots is how many full snapshots a running ControlPlane keeps,
                          the newest: days, at the default schedule. Only the newest keeps the
                          delta snapshots after it, since no delta retention period is set, so an
                          older one restores to its own revision.
                        format: int32
                        maximum: 3650
                        minimum: 1
                        type: integer
                    type: object
                  store:
                    description: store is the bucket.
                    properties:
                      bucket:
                        description: bucket name.
                        maxLength: 63
                        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{1,61}[a-zA-Z0-9]$
                        type: string
                      endpoint:
                        description: endpoint for S3-compatible stores.
                        maxLength: 512
                        type: string
                        x-kubernetes-validations:
                        - message: must be a URL
                          rule: self.startsWith('https://') || self.startsWith('http://')
                        - message: must be a URL
                          rule: isURL(self)
                      prefix:
                        description: |-
                          prefix inside the bucket; each ControlPlane's snapshots go under
                          <prefix>/<namespace UID>/controlplanes/<ControlPlane UID>. It neither
                          contains v1/ nor ends in v1, which etcd-backup-restore would misread.
                        maxLength: 253
                        type: string
                        x-kubernetes-validations:
                        - message: 'must neither contain v1/ nor end in v1: etcd-backup-restore''s
                            snapshot parser takes the last v1/ in a key for its layout
                            and would ignore every snapshot under this prefix'
                          rule: '!(self + ''/'').contains(''v1/'')'
                      provider:
                        description: provider is the object store's kind.
                        enum:
                        - S3
                        - GCS
                        - ABS
                        - Swift
                        type: string
                      region:
                        description: region of the bucket.
                        maxLength: 64
                        type: string
                      secretRef:
                        description: secretRef names the credentials.
                        properties:
                          name:
                            description: name of the Secret.
                            maxLength: 253
                            minLength: 1
                            type: string
                          namespace:
                            description: namespace of the Secret.
                            maxLength: 63
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                    required:
                    - bucket
                    - provider
                    - secretRef
                    type: object
                required:
                - store
                type: object
              etcd:
                description: etcd configures the members.
                properties:
                  autoCompaction:
                    description: autoCompaction is etcd's own compaction.
                    properties:
                      mode:
                        default: periodic
                        description: mode is periodic or revision.
                        enum:
                        - periodic
                        - revision
                        type: string
                      retention:
                        default: 15m
                        description: |-
                          retention is a number of hours or a duration in periodic mode, a
                          revision count in revision mode; etcd refuses to start with anything
                          else.
                        maxLength: 32
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: retention must be a number, or in periodic mode a duration
                      rule: '!has(self.retention) || self.retention.matches(''^[0-9]+$'')
                        || ((!has(self.mode) || self.mode == ''periodic'') && duration(self.retention)
                        >= duration(''0s''))'
                  defragmentation:
                    description: defragmentation runs followers first, the leader
                      last.
                    properties:
                      schedule:
                        description: |-
                          schedule is a cron expression of five fields separated by single
                          spaces, without lists, whose ranges ascend and whose days of the week
                          run from 1 to 6, since etcd-druid refuses 0 and the backup sidecar 7;
                          */7 selects Sunday.
                        maxLength: 64
                        pattern: ^(\*|[1-5]?[0-9]|[1-5]?[0-9]-[1-5]?[0-9]|(?:[1-9]|[1-4][0-9]|5[0-9])\/(?:[1-9]|[1-4][0-9]|5[0-9]|60)|\*\/(?:[1-9]|[1-4][0-9]|5[0-9]|60))\s+(\*|[0-9]|1[0-9]|2[0-3]|[0-9]-(?:[0-9]|1[0-9]|2[0-3])|1[0-9]-(?:1[0-9]|2[0-3])|2[0-3]-2[0-3]|(?:[1-9]|1[0-9]|2[0-3])\/(?:[1-9]|1[0-9]|2[0-4])|\*\/(?:[1-9]|1[0-9]|2[0-4]))\s+(\*|[1-9]|[12][0-9]|3[01]|[1-9]-(?:[1-9]|[12][0-9]|3[01])|[12][0-9]-(?:[12][0-9]|3[01])|3[01]-3[01]|(?:[1-9]|[12][0-9]|30)\/(?:[1-9]|[12][0-9]|3[01])|\*\/(?:[1-9]|[12][0-9]|3[01]))\s+(\*|[1-9]|1[0-2]|[1-9]-(?:[1-9]|1[0-2])|1[0-2]-1[0-2]|(?:[1-9]|1[0-2])\/(?:[1-9]|1[0-2])|\*\/(?:[1-9]|1[0-2]))\s+(\*|[1-7]|[1-6]-[1-7]|[1-6]\/[1-7]|\*\/[1-7])$
                        type: string
                        x-kubernetes-validations:
                        - message: must be five fields separated by single spaces
                          rule: self.matches('^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+$')
                        - message: every range must ascend
                          rule: self.split(' ').all(f, !f.split('/')[0].matches('^[0-9]+-[0-9]+$')
                            || int(f.split('/')[0].split('-')[0]) <= int(f.split('/')[0].split('-')[1]))
                        - message: the day of the week cannot be 7
                          rule: self.split(' ').size() != 5 || !self.split(' ')[4].matches('^(7|[1-6]-7)$')
                    required:
                    - schedule
                    type: object
                  quotaBackendBytes:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 4Gi
                    description: |-
                      quotaBackendBytes is the database size limit, above zero: the backup
                      sidecar refuses to start with zero or less.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                    x-kubernetes-validations:
                    - message: must be greater than zero
                      rule: quantity(string(self)).isGreaterThan(quantity('0'))
                  resources:
                    description: resources of each member.
                    properties:
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: limits are the most the container may use.
                        maxProperties: 3
                        type: object
                        x-kubernetes-validations:
                        - message: a control plane container takes cpu, memory and
                            ephemeral-storage alone
                          rule: self.all(k, k in ['cpu', 'memory', 'ephemeral-storage'])
                        - message: a quantity cannot be negative
                          rule: self.all(k, !quantity(string(self[k])).isLessThan(quantity('0')))
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: requests are what the container is scheduled
                          by.
                        maxProperties: 3
                        type: object
                        x-kubernetes-validations:
                        - message: a control plane container takes cpu, memory and
                            ephemeral-storage alone
                          rule: self.all(k, k in ['cpu', 'memory', 'ephemeral-storage'])
                        - message: a quantity cannot be negative
                          rule: self.all(k, !quantity(string(self[k])).isLessThan(quantity('0')))
                    type: object
                    x-kubernetes-validations:
                    - message: a request cannot exceed its limit
                      rule: '!has(self.requests) || !has(self.limits) || self.requests.all(k,
                        !(k in self.limits) || quantity(string(self.requests[k])).compareTo(quantity(string(self.limits[k])))
                        <= 0)'
                type: object
              placement:
                description: placement says where members run.
                properties:
                  nodeSelector:
                    additionalProperties:
                      description: |-
                        LabelValue is a label's value: empty, or at most 63 alphanumerics, dashes,
                        underscores and dots that begin and end with an alphanumeric.
                      maxLength: 63
                      type: string
                      x-kubernetes-validations:
                      - message: 'must be a label''s value: empty, or alphanumerics,
                          dashes, underscores and dots that begin and end with an
                          alphanumeric'
                        rule: self.matches('^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$')
                    description: 'nodeSelector for every pod: label names and values.'
                    maxProperties: 16
                    type: object
                    x-kubernetes-validations:
                    - message: 'a key must be a label''s name: at most 63 alphanumerics,
                        dashes, underscores and dots that begin and end with an alphanumeric,
                        after a lowercase DNS subdomain of at most 253 characters
                        and a slash'
                      rule: 'self.all(k, size(k) <= 317 && k.matches(''^([a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$'')
                        && (k.contains(''/'') ? size(k.split(''/'')[0]) <= 253 &&
                        size(k.split(''/'')[1]) <= 63 : size(k) <= 63))'
                  priorityClassName:
                    description: priorityClassName for every pod, a lowercase DNS
                      subdomain.
                    maxLength: 253
                    type: string
                    x-kubernetes-validations:
                    - message: must be a lowercase DNS subdomain
                      rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                  tolerations:
                    description: tolerations for every pod.
                    items:
                      description: |-
                        Toleration is a pod's toleration as pod validation takes it, without the
                        operators Lt and Gt.
                      properties:
                        effect:
                          description: |-
                            effect is the taint's effect, NoSchedule, PreferNoSchedule or NoExecute;
                            without it the toleration matches every effect.
                          enum:
                          - NoSchedule
                          - PreferNoSchedule
                          - NoExecute
                          type: string
                        key:
                          description: |-
                            key is the taint's key, a label's name; without it, and with operator
                            Exists, the toleration matches every taint.
                          maxLength: 317
                          type: string
                          x-kubernetes-validations:
                          - message: 'must be a label''s name: at most 63 alphanumerics,
                              dashes, underscores and dots that begin and end with
                              an alphanumeric, after a lowercase DNS subdomain of
                              at most 253 characters and a slash'
                            rule: 'size(self) == 0 || self.matches(''^([a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$'')
                              && (self.contains(''/'') ? size(self.split(''/'')[0])
                              <= 253 && size(self.split(''/'')[1]) <= 63 : size(self)
                              <= 63)'
                        operator:
                          description: |-
                            operator is Equal, the taint's value equal to value, or Exists, any
                            value; Equal by default.
                          enum:
                          - Equal
                          - Exists
                          type: string
                        tolerationSeconds:
                          description: |-
                            tolerationSeconds is how long a pod stays on a node tainted NoExecute;
                            without it, for as long as the taint.
                          format: int64
                          type: integer
                        value:
                          description: value is the taint's value that operator Equal
                            matches.
                          maxLength: 63
                          type: string
                          x-kubernetes-validations:
                          - message: 'must be a label''s value: empty, or alphanumerics,
                              dashes, underscores and dots that begin and end with
                              an alphanumeric'
                            rule: self.matches('^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$')
                      type: object
                      x-kubernetes-validations:
                      - message: a toleration without a key has operator Exists
                        rule: has(self.key) && size(self.key) > 0 || has(self.operator)
                          && self.operator == 'Exists'
                      - message: tolerationSeconds is set only with effect NoExecute
                        rule: '!has(self.tolerationSeconds) || has(self.effect) &&
                          self.effect == ''NoExecute'''
                      - message: a toleration with operator Exists has no value
                        rule: '!has(self.operator) || self.operator != ''Exists''
                          || !has(self.value) || size(self.value) == 0'
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              storage:
                description: storage is the members' volumes.
                properties:
                  className:
                    description: className is the StorageClass; empty means the cluster's
                      default.
                    maxLength: 253
                    type: string
                  reclaimPolicy:
                    default: Retain
                    description: reclaimPolicy is what happens to the volumes of a
                      deleted ControlPlane.
                    enum:
                    - Delete
                    - Retain
                    type: string
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: size of each member's volume.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - size
                type: object
            required:
            - storage
            type: object
            x-kubernetes-validations:
            - message: 'storage.size must be at least twice the etcd quota, etcd.quotaBackendBytes
                or 4Gi: defragmentation writes a copy of the database beside it'
              rule: '!quantity(string(self.storage.size)).isLessThan((has(self.etcd)
                && has(self.etcd.quotaBackendBytes) ? quantity(string(self.etcd.quotaBackendBytes))
                : quantity(''4Gi'')).add(has(self.etcd) && has(self.etcd.quotaBackendBytes)
                ? quantity(string(self.etcd.quotaBackendBytes)) : quantity(''4Gi'')))'
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
