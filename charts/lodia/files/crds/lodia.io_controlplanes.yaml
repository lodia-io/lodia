---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: controlplanes.lodia.io
spec:
  group: lodia.io
  names:
    kind: ControlPlane
    listKind: ControlPlaneList
    plural: controlplanes
    shortNames:
    - cp
    singular: controlplane
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .status.endpoint.apiServer.host
      name: Endpoint
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ControlPlane is one tenant cluster's control plane: an API server with its
          konnectivity server, a controller manager, a scheduler and a datastore,
          running as pods in this namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state of the control plane.
            properties:
              addons:
                description: addons configures what Lodia runs inside the tenant cluster.
                properties:
                  coreDNS:
                    description: coreDNS configures cluster DNS.
                    properties:
                      enabled:
                        default: true
                        description: enabled is false when the tenant brings its own
                          DNS.
                        type: boolean
                      replicas:
                        default: 2
                        description: replicas of CoreDNS.
                        format: int32
                        maximum: 10
                        minimum: 1
                        type: integer
                    type: object
                  konnectivity:
                    description: konnectivity configures the tunnel between the control
                      plane and the nodes.
                    properties:
                      agent:
                        description: agent configures the agents in the tenant.
                        properties:
                          mode:
                            default: DaemonSet
                            description: mode is DaemonSet, an agent per node, or
                              Deployment.
                            enum:
                            - DaemonSet
                            - Deployment
                            type: string
                          replicas:
                            description: replicas of the Deployment mode.
                            format: int32
                            maximum: 10
                            minimum: 1
                            type: integer
                        type: object
                      version:
                        description: |-
                          version pins the konnectivity version across a Kubernetes upgrade;
                          empty follows the version table.
                        maxLength: 16
                        pattern: ^v0\.[0-9]+\.[0-9]+$
                        type: string
                    type: object
                  kubeProxy:
                    description: kubeProxy configures kube-proxy.
                    properties:
                      conntrack:
                        description: conntrack configures kube-proxy's connection
                          tracking.
                        properties:
                          maxPerCore:
                            description: |-
                              maxPerCore is kube-proxy's conntrack.maxPerCore, the connections tracked
                              per CPU core; 0 leaves the node's nf_conntrack_max as it is. Unset
                              means kube-proxy's default.
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                      enabled:
                        default: true
                        description: enabled is false for CNIs that replace kube-proxy.
                        type: boolean
                      healthzBindAddress:
                        description: |-
                          healthzBindAddress is the IP address kube-proxy serves its health port,
                          10256, on: beyond loopback for cloud load balancers; loopback by default.
                        maxLength: 45
                        type: string
                        x-kubernetes-validations:
                        - message: must be an IP address
                          rule: isIP(self)
                      mode:
                        default: iptables
                        description: mode is iptables, nftables or ipvs.
                        enum:
                        - iptables
                        - nftables
                        - ipvs
                        type: string
                    type: object
                type: object
              apiServer:
                description: apiServer configures kube-apiserver.
                properties:
                  advertiseAddress:
                    description: |-
                      advertiseAddress is the address apiserver-proxy owns on every node,
                      which it does in gateway mode and in loadBalancer mode unless
                      endpoint.loadBalancer.host is an IP address, and is set nowhere else:
                      240.0.0.1 by default when the first service range is IPv4, and required
                      when it is IPv6. It cannot change.
                    maxLength: 45
                    type: string
                    x-kubernetes-validations:
                    - message: must be a unicast IP address in canonical form, neither
                        loopback nor link-local
                      rule: isIP(self) && ip.isCanonical(self) && ip(self).isGlobalUnicast()
                  authentication:
                    description: |-
                      authentication configures structured authentication; the anonymous
                      section is Lodia's.
                    properties:
                      jwt:
                        description: |-
                          jwt are JWT authenticators, kube-apiserver's apiserver.config.k8s.io/v1
                          JWTAuthenticator field for field.
                        items:
                          description: JWTAuthenticator accepts the tokens of one
                            issuer.
                          properties:
                            claimMappings:
                              description: claimMappings say which claims become the
                                user.
                              properties:
                                extra:
                                  description: extra are the user's extra attributes,
                                    each from a CEL expression.
                                  items:
                                    description: ExtraMapping is an extra attribute
                                      of the user, from a CEL expression.
                                    properties:
                                      key:
                                        description: key is the extra attribute's
                                          key, a lowercase domain-prefixed path.
                                        maxLength: 512
                                        type: string
                                        x-kubernetes-validations:
                                        - message: must be a lowercase domain-prefixed
                                            path, such as example.org/foo
                                          rule: self.matches(r'^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/[-a-z0-9/._~%!$&\x27()*+,;=:]+$')
                                        - message: k8s.io, kubernetes.io and their
                                            subdomains are reserved
                                          rule: '!self.split(''/'')[0].matches(''(^|[.])(k8s|kubernetes)[.]io$'')'
                                      valueExpression:
                                        description: valueExpression is a CEL expression
                                          that produces the attribute's string or
                                          string array value.
                                        maxLength: 2048
                                        minLength: 1
                                        type: string
                                    required:
                                    - key
                                    - valueExpression
                                    type: object
                                  maxItems: 8
                                  type: array
                                  x-kubernetes-list-map-keys:
                                  - key
                                  x-kubernetes-list-type: map
                                groups:
                                  description: groups is where the user's groups come
                                    from.
                                  properties:
                                    claim:
                                      description: claim is the JWT claim to use.
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                    expression:
                                      description: expression is a CEL expression
                                        on the token's claims.
                                      maxLength: 2048
                                      minLength: 1
                                      type: string
                                    prefix:
                                      description: prefix is prepended to the claim's
                                        value; required with claim, and it may be
                                        empty.
                                      maxLength: 256
                                      type: string
                                  type: object
                                  x-kubernetes-validations:
                                  - message: set at most one of claim and expression
                                    rule: '!(has(self.claim) && has(self.expression))'
                                  - message: prefix is required with claim; it may
                                      be empty
                                    rule: '!has(self.claim) || has(self.prefix)'
                                  - message: prefix is set only with claim
                                    rule: '!has(self.expression) || !has(self.prefix)'
                                uid:
                                  description: uid is where the user's uid comes from.
                                  properties:
                                    claim:
                                      description: claim is the JWT claim to use.
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                    expression:
                                      description: expression is a CEL expression
                                        on the token's claims.
                                      maxLength: 2048
                                      minLength: 1
                                      type: string
                                  type: object
                                  x-kubernetes-validations:
                                  - message: set at most one of claim and expression
                                    rule: '!(has(self.claim) && has(self.expression))'
                                username:
                                  description: username is where the user's name comes
                                    from.
                                  properties:
                                    claim:
                                      description: claim is the JWT claim to use.
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                    expression:
                                      description: expression is a CEL expression
                                        on the token's claims.
                                      maxLength: 2048
                                      minLength: 1
                                      type: string
                                    prefix:
                                      description: prefix is prepended to the claim's
                                        value; required with claim, and it may be
                                        empty.
                                      maxLength: 256
                                      type: string
                                  type: object
                                  x-kubernetes-validations:
                                  - message: set exactly one of claim and expression
                                    rule: has(self.claim) != has(self.expression)
                                  - message: prefix is required with claim; it may
                                      be empty
                                    rule: '!has(self.claim) || has(self.prefix)'
                                  - message: prefix is set only with claim
                                    rule: '!has(self.expression) || !has(self.prefix)'
                              required:
                              - username
                              type: object
                            claimValidationRules:
                              description: |-
                                claimValidationRules are claims a token must hold, or CEL expressions on
                                its claims that must be true.
                              items:
                                description: |-
                                  ClaimValidationRule is a claim a token must hold, or a CEL expression on its
                                  claims that must be true.
                                properties:
                                  claim:
                                    description: claim is the name of a required claim.
                                    maxLength: 253
                                    minLength: 1
                                    type: string
                                  expression:
                                    description: expression is a CEL expression on
                                      the token's claims that must return true.
                                    maxLength: 2048
                                    minLength: 1
                                    type: string
                                  message:
                                    description: message is the error message when
                                      expression returns false.
                                    maxLength: 256
                                    type: string
                                  requiredValue:
                                    description: requiredValue is the value of a required
                                      claim.
                                    maxLength: 1024
                                    type: string
                                type: object
                                x-kubernetes-validations:
                                - message: set exactly one of claim and expression
                                  rule: has(self.claim) != has(self.expression)
                                - message: message is set only with expression
                                  rule: '!has(self.claim) || !has(self.message) ||
                                    size(self.message) == 0'
                                - message: requiredValue is set only with claim
                                  rule: '!has(self.expression) || !has(self.requiredValue)
                                    || size(self.requiredValue) == 0'
                              maxItems: 8
                              type: array
                              x-kubernetes-list-type: atomic
                              x-kubernetes-validations:
                              - message: each claim appears once
                                rule: self.all(r, !has(r.claim) || self.exists_one(s,
                                  has(s.claim) && s.claim == r.claim))
                              - message: each expression appears once
                                rule: self.all(r, !has(r.expression) || self.exists_one(s,
                                  has(s.expression) && s.expression == r.expression))
                            issuer:
                              description: issuer is where the tokens come from and
                                whom they are for.
                              properties:
                                audienceMatchPolicy:
                                  description: audienceMatchPolicy is MatchAny, required
                                    with more than one audience.
                                  enum:
                                  - ""
                                  - MatchAny
                                  type: string
                                audiences:
                                  description: audiences are the aud values a token
                                    may carry.
                                  items:
                                    maxLength: 512
                                    minLength: 1
                                    type: string
                                  maxItems: 8
                                  minItems: 1
                                  type: array
                                  x-kubernetes-list-type: set
                                certificateAuthority:
                                  description: |-
                                    certificateAuthority is the PEM bundle the issuer's serving certificate
                                    is verified against; the API server image's roots when empty.
                                  maxLength: 16384
                                  type: string
                                discoveryURL:
                                  description: |-
                                    discoveryURL is where the discovery document is fetched from, when not
                                    under url.
                                  maxLength: 512
                                  type: string
                                  x-kubernetes-validations:
                                  - message: must be an https URL without a user,
                                      a query or a fragment
                                    rule: size(self) == 0 || self.matches('^[hH][tT][tT][pP][sS]://[^/?#@]*([/?#].*)?$')
                                      && !self.matches('[?][^#]') && !self.matches('#.')
                                egressSelectorType:
                                  default: cluster
                                  description: |-
                                    egressSelectorType is cluster: the API server reaches the issuer
                                    through konnectivity, from the tenant's nodes.
                                  enum:
                                  - ""
                                  - cluster
                                  type: string
                                url:
                                  description: url is the issuer, the iss claim of
                                    its tokens.
                                  maxLength: 512
                                  type: string
                                  x-kubernetes-validations:
                                  - message: must be an https URL without a user,
                                      a query or a fragment
                                    rule: self.matches('^[hH][tT][tT][pP][sS]://[^/?#@]*([/?#].*)?$')
                                      && !self.matches('[?][^#]') && !self.matches('#.')
                              required:
                              - audiences
                              - url
                              type: object
                              x-kubernetes-validations:
                              - message: audienceMatchPolicy must be MatchAny for
                                  multiple audiences
                                rule: size(self.audiences) == 1 || has(self.audienceMatchPolicy)
                                  && self.audienceMatchPolicy == 'MatchAny'
                              - message: discoveryURL must differ from url
                                rule: '!has(self.discoveryURL) || self.discoveryURL
                                  != self.url'
                            userValidationRules:
                              description: userValidationRules are CEL expressions
                                on the user that must be true.
                              items:
                                description: UserValidationRule is a CEL expression
                                  on the user that must be true.
                                properties:
                                  expression:
                                    description: expression is a CEL expression on
                                      the user that must return true.
                                    maxLength: 2048
                                    minLength: 1
                                    type: string
                                  message:
                                    description: message is the error message when
                                      expression returns false.
                                    maxLength: 256
                                    type: string
                                required:
                                - expression
                                type: object
                              maxItems: 8
                              type: array
                              x-kubernetes-list-map-keys:
                              - expression
                              x-kubernetes-list-type: map
                          required:
                          - claimMappings
                          - issuer
                          type: object
                        maxItems: 8
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: each issuer.url appears once
                          rule: self.all(a, self.exists_one(b, b.issuer.url == a.issuer.url))
                        - message: each issuer.discoveryURL appears once
                          rule: self.all(a, !has(a.issuer.discoveryURL) || size(a.issuer.discoveryURL)
                            == 0 || self.exists_one(b, has(b.issuer.discoveryURL)
                            && b.issuer.discoveryURL == a.issuer.discoveryURL))
                    type: object
                  encryption:
                    description: encryption configures encryption of Secrets at rest.
                    properties:
                      provider:
                        default: secretbox
                        description: provider is None, secretbox or aescbc.
                        enum:
                        - None
                        - secretbox
                        - aescbc
                        type: string
                    type: object
                  extraArgs:
                    additionalProperties:
                      description: FlagValue is a flag's value as a component reads
                        it.
                      maxLength: 4096
                      type: string
                    description: |-
                      extraArgs are flags passed to kube-apiserver, each under its name as
                      kube-apiserver spells it. The schema refuses the flags Lodia sets; those
                      whose defaults it relies on; the flags that conflict with one Lodia
                      sets; those that name a file, which no tenant can put in the pod, or act
                      only with one; the mixed-version proxy's, which would reach every
                      replica at the one address Lodia advertises for all of them; help, which
                      ends the process; and version, which ends it or, given as vX.Y.Z, sets
                      the version it reports while it runs on. It checks the values of
                      disable-admission-plugins, service-account-max-token-expiration,
                      event-ttl and runtime-config. Every other flag and value is passed as
                      written, and a flag or a value kube-apiserver refuses makes it exit.
                      enable-admission-plugins merges: its entries follow Lodia's.
                      featureGates sets feature-gates.
                    maxProperties: 64
                    type: object
                    x-kubernetes-validations:
                    - message: 'a key must be a flag''s name as the component spells
                        it: lowercase letters and digits in words joined by single
                        dashes'
                      rule: self.all(k, k.matches('^[a-z0-9]+(-[a-z0-9]+)*$'))
                    - message: Lodia sets this flag
                      rule: '!self.exists(k, k in [''advertise-address'', ''allow-privileged'',
                        ''authentication-config'', ''authorization-mode'', ''client-ca-file'',
                        ''egress-selector-config-file'', ''enable-bootstrap-token-auth'',
                        ''encryption-provider-config'', ''encryption-provider-config-automatic-reload'',
                        ''endpoint-reconciler-type'', ''etcd-cafile'', ''etcd-certfile'',
                        ''etcd-keyfile'', ''etcd-servers'', ''feature-gates'', ''goaway-chance'',
                        ''kubelet-client-certificate'', ''kubelet-client-key'', ''kubelet-preferred-address-types'',
                        ''proxy-client-cert-file'', ''proxy-client-key-file'', ''requestheader-allowed-names'',
                        ''requestheader-client-ca-file'', ''requestheader-extra-headers-prefix'',
                        ''requestheader-group-headers'', ''requestheader-username-headers'',
                        ''secure-port'', ''service-account-issuer'', ''service-account-jwks-uri'',
                        ''service-account-signing-endpoint'', ''service-cluster-ip-range'',
                        ''shutdown-delay-duration'', ''shutdown-watch-termination-grace-period'',
                        ''tls-cert-file'', ''tls-private-key-file''])'
                    - message: Lodia relies on this flag's default
                      rule: '!self.exists(k, k in [''bind-address'', ''emulated-version'',
                        ''emulation-forward-compatible'', ''etcd-prefix'', ''etcd-servers-overrides'',
                        ''min-compatibility-version'', ''request-timeout'', ''runtime-config-emulation-forward-compatible'',
                        ''shutdown-send-retry-after''])'
                    - message: this flag conflicts with one Lodia sets
                      rule: '!self.exists(k, k in [''admission-control'', ''anonymous-auth'',
                        ''apiserver-count'', ''authorization-config'', ''authorization-policy-file'',
                        ''authorization-webhook-cache-authorized-ttl'', ''authorization-webhook-cache-unauthorized-ttl'',
                        ''authorization-webhook-config-file'', ''authorization-webhook-version'',
                        ''cert-dir'', ''service-account-key-file'', ''service-account-signing-key-file'']
                        || k.startsWith(''oidc-''))'
                    - message: this flag names a file, or acts only with one, and
                        the pod holds no file a tenant chooses
                      rule: '!self.exists(k, k in [''admission-control-config-file'',
                        ''allow-metric-labels-manifest'', ''kubelet-certificate-authority'',
                        ''tls-sni-cert-key'', ''token-auth-file'', ''tracing-config-file'']
                        || k.startsWith(''audit-'') || k.startsWith(''authentication-token-webhook-''))'
                    - message: the mixed-version proxy would reach every replica of
                        the API server at the one address Lodia advertises for all
                        of them
                      rule: '!self.exists(k, k in [''peer-advertise-ip'', ''peer-advertise-port'',
                        ''peer-ca-file''])'
                    - message: this flag makes the component exit, or report another
                        version than the one it runs
                      rule: '!self.exists(k, k in [''help'', ''version''])'
                    - message: disable-admission-plugins is plugin names of letters
                        and digits joined by commas, and nothing else, since kube-apiserver
                        reads it as CSV
                      rule: '!(''disable-admission-plugins'' in self) || self[''disable-admission-plugins''].matches(''^[A-Za-z0-9]+(,[A-Za-z0-9]+)*$'')'
                    - message: disable-admission-plugins cannot name NodeRestriction,
                        which Lodia enables
                      rule: '!(''disable-admission-plugins'' in self) || !self[''disable-admission-plugins''].matches(''(^|,)NodeRestriction(,|$)'')'
                    - message: 'service-account-max-token-expiration is a duration
                        as Go prints it, without its zero units: hours, then minutes
                        and seconds under 60, as 720h or 1h30m'
                      rule: '!(''service-account-max-token-expiration'' in self) ||
                        size(self[''service-account-max-token-expiration'']) > 0 &&
                        self[''service-account-max-token-expiration''].matches(''^([1-9][0-9]*h)?([1-9]m|[1-5][0-9]m)?([1-9]s|[1-5][0-9]s)?$'')'
                    - message: kube-apiserver refuses a service-account-max-token-expiration
                        other than 0 under 1h, and one above 8760h, the longest token
                        lodia-signer signs; 0 means 8760h, so leave the flag out instead
                      rule: '!(''service-account-max-token-expiration'' in self) ||
                        duration(self[''service-account-max-token-expiration'']) >=
                        duration(''1h'') && duration(self[''service-account-max-token-expiration''])
                        <= duration(''8760h'')'
                    - message: event-ttl is a duration as Go's time.ParseDuration
                        reads it, such as 1h30m0s or 3600s
                      rule: '!(''event-ttl'' in self) || self[''event-ttl''].matches(''^[-+]?(0|(([0-9]+([.][0-9]*)?|[.][0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$'')'
                    - message: 'event-ttl is at least 1h, kube-apiserver''s default:
                        with 0 Events never expire and fill the tenant''s etcd to
                        its quota, and an Event''s lease that expires during a restore
                        through deltas aborts it or drops a write (etcd-backup-restore#1045,
                        #1046)'
                      rule: '!(''event-ttl'' in self) || duration(self[''event-ttl''])
                        >= duration(''1h'')'
                    - message: runtime-config is pairs of an API or api/all, api/ga,
                        api/beta or api/alpha and true or false, joined by commas,
                        and nothing else, since kube-apiserver trims spaces and reads
                        an empty value, 1 and t as true
                      rule: '!(''runtime-config'' in self) || self[''runtime-config''].matches(''^[a-z0-9]([-a-z0-9.]*[a-z0-9])?(/[a-z0-9]([-a-z0-9.]*[a-z0-9])?){0,2}=(true|false)(,[a-z0-9]([-a-z0-9.]*[a-z0-9])?(/[a-z0-9]([-a-z0-9.]*[a-z0-9])?){0,2}=(true|false))*$'')'
                    - message: 'runtime-config cannot turn off api/all, api/ga, or
                        a group version Lodia''s controllers use or a resource of
                        one: v1, apps/v1, rbac.authorization.k8s.io/v1, discovery.k8s.io/v1,
                        coordination.k8s.io/v1, certificates.k8s.io/v1, authentication.k8s.io/v1,
                        authorization.k8s.io/v1 and apiregistration.k8s.io/v1'
                      rule: '!(''runtime-config'' in self) || !self[''runtime-config''].matches(''(^|,)(api/(all|ga)|((api/)?v1|(apps|rbac[.]authorization[.]k8s[.]io|discovery[.]k8s[.]io|coordination[.]k8s[.]io|certificates[.]k8s[.]io|authentication[.]k8s[.]io|authorization[.]k8s[.]io|apiregistration[.]k8s[.]io)/v1)(/[^,=]+)?)=false(,|$)'')'
                    - message: 'runtime-config cannot turn off a group version kube-apiserver
                        needs to become ready, or a resource of one: admissionregistration.k8s.io/v1,
                        apiextensions.k8s.io/v1, networking.k8s.io/v1, node.k8s.io/v1,
                        resource.k8s.io/v1, scheduling.k8s.io/v1 and storage.k8s.io/v1'
                      rule: '!(''runtime-config'' in self) || !self[''runtime-config''].matches(''(^|,)(admissionregistration[.]k8s[.]io|apiextensions[.]k8s[.]io|networking[.]k8s[.]io|node[.]k8s[.]io|resource[.]k8s[.]io|scheduling[.]k8s[.]io|storage[.]k8s[.]io)/v1(/[^,=]+)?=false(,|$)'')'
                  featureGates:
                    additionalProperties:
                      type: boolean
                    description: |-
                      featureGates are passed to kube-apiserver, each under its gate's bare
                      name.
                    maxProperties: 64
                    type: object
                    x-kubernetes-validations:
                    - message: kube-apiserver refuses service-account-signing-endpoint,
                        which Lodia sets, without ExternalServiceAccountTokenSigner
                      rule: '!(''ExternalServiceAccountTokenSigner'' in self) || self[''ExternalServiceAccountTokenSigner'']'
                    - message: kube-apiserver refuses the egressSelectorType Lodia
                        renders for every JWT authenticator without StructuredAuthenticationConfigurationEgressSelector
                      rule: '!(''StructuredAuthenticationConfigurationEgressSelector''
                        in self) || self[''StructuredAuthenticationConfigurationEgressSelector'']'
                    - message: 'a key must be a gate''s bare name, a capital letter
