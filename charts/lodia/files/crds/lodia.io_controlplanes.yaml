---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: controlplanes.lodia.io
spec:
  group: lodia.io
  names:
    kind: ControlPlane
    listKind: ControlPlaneList
    plural: controlplanes
    shortNames:
    - cp
    singular: controlplane
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .status.endpoint.apiServer.host
      name: Endpoint
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ControlPlane is one tenant cluster's control plane: an API server with its
          konnectivity server, a controller manager, a scheduler and a datastore,
          running as pods in this namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ControlPlaneSpec is what the owner of the cluster wants.
            properties:
              addons:
                description: Addons configures what Lodia runs inside the tenant cluster.
                properties:
                  coreDNS:
                    description: CoreDNS configures cluster DNS.
                    properties:
                      enabled:
                        default: true
                        description: Enabled is false when the tenant brings its own
                          DNS.
                        type: boolean
                      replicas:
                        default: 2
                        description: Replicas of CoreDNS.
                        format: int32
                        maximum: 10
                        minimum: 1
                        type: integer
                    type: object
                  konnectivity:
                    description: Konnectivity configures the tunnel between the control
                      plane and the nodes.
                    properties:
                      agent:
                        description: Agent configures the agents in the tenant.
                        properties:
                          mode:
                            default: DaemonSet
                            description: Mode is DaemonSet, an agent per node, or
                              Deployment.
                            enum:
                            - DaemonSet
                            - Deployment
                            type: string
                          replicas:
                            description: Replicas of the Deployment mode.
                            format: int32
                            maximum: 10
                            minimum: 1
                            type: integer
                        type: object
                      version:
                        description: |-
                          Version pins the konnectivity version across a Kubernetes upgrade;
                          empty follows the version table.
                        maxLength: 16
                        pattern: ^v0\.[0-9]+\.[0-9]+$
                        type: string
                    type: object
                  kubeProxy:
                    description: KubeProxy configures kube-proxy.
                    properties:
                      conntrack:
                        description: Conntrack configures kube-proxy's connection
                          tracking.
                        properties:
                          maxPerCore:
                            description: |-
                              MaxPerCore is kube-proxy's conntrack.maxPerCore, the connections tracked
                              per CPU core; 0 leaves the node's nf_conntrack_max as it is. Unset
                              means kube-proxy's default.
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                      enabled:
                        default: true
                        description: Enabled is false for CNIs that replace kube-proxy.
                        type: boolean
                      healthzBindAddress:
                        description: |-
                          HealthzBindAddress is the IP address kube-proxy serves its health port,
                          10256, on: beyond loopback for cloud load balancers; loopback by default.
                        maxLength: 45
                        type: string
                        x-kubernetes-validations:
                        - message: must be an IP address
                          rule: isIP(self)
                      mode:
                        default: iptables
                        description: Mode is iptables, nftables or ipvs.
                        enum:
                        - iptables
                        - nftables
                        - ipvs
                        type: string
                    type: object
                type: object
              apiServer:
                description: APIServer configures kube-apiserver.
                properties:
                  admission:
                    description: Admission names a ConfigMap with an AdmissionConfiguration.
                    properties:
                      configRef:
                        description: ConfigRef names a ConfigMap with an AdmissionConfiguration.
                        properties:
                          name:
                            description: Name of the object.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - configRef
                    type: object
                  advertiseAddress:
                    description: |-
                      AdvertiseAddress is the address apiserver-proxy owns on every node in
                      gateway mode: 240.0.0.1 by default when the first service range is
                      IPv4, and required when it is IPv6. It cannot change.
                    maxLength: 45
                    type: string
                    x-kubernetes-validations:
                    - message: must be a unicast IP address in canonical form, neither
                        loopback nor link-local
                      rule: isIP(self) && ip.isCanonical(self) && ip(self).isGlobalUnicast()
                  audit:
                    description: Audit configures audit logging.
                    properties:
                      policyRef:
                        description: PolicyRef names a ConfigMap with key policy.yaml.
                        properties:
                          name:
                            description: Name of the object.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - policyRef
                    type: object
                  authentication:
                    description: |-
                      Authentication configures structured authentication; the anonymous
                      section is Lodia's.
                    properties:
                      jwt:
                        description: JWT authenticators, such as OIDC providers.
                        items:
                          description: JWTAuthenticator accepts tokens from one issuer.
                          properties:
                            claimMappings:
                              description: ClaimMappings say which claims become the
                                user name and groups.
                              properties:
                                groups:
                                  description: Groups is the claim for the groups.
                                  properties:
                                    claim:
                                      description: Claim is the JWT claim.
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                    prefix:
                                      description: Prefix is added to the claim's
                                        value.
                                      maxLength: 64
                                      type: string
                                  required:
                                  - claim
                                  type: object
                                username:
                                  description: Username is the claim for the user
                                    name.
                                  properties:
                                    claim:
                                      description: Claim is the JWT claim.
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                    prefix:
                                      description: Prefix is added to the claim's
                                        value.
                                      maxLength: 64
                                      type: string
                                  required:
                                  - claim
                                  type: object
                              type: object
                            issuer:
                              description: Issuer is the token issuer.
                              properties:
                                audiences:
                                  description: Audiences accepted in the tokens.
                                  items:
                                    maxLength: 253
                                    type: string
                                  maxItems: 8
                                  minItems: 1
                                  type: array
                                  x-kubernetes-list-type: set
                                url:
                                  description: URL is the issuer's https URL.
                                  maxLength: 512
                                  type: string
                                  x-kubernetes-validations:
                                  - message: must be an https URL
                                    rule: self.startsWith('https://')
                              required:
                              - audiences
                              - url
                              type: object
                          required:
                          - issuer
                          type: object
                        maxItems: 8
                        type: array
                        x-kubernetes-list-type: atomic
                    type: object
                  encryption:
                    description: Encryption configures encryption of Secrets at rest.
                    properties:
                      provider:
                        default: secretbox
                        description: Provider is None, secretbox, aescbc or kms.
                        enum:
                        - None
                        - secretbox
                        - aescbc
                        - kms
                        type: string
                    type: object
                  extraArgs:
                    additionalProperties:
                      type: string
                    description: |-
                      ExtraArgs are flags passed to kube-apiserver. The flags Lodia sets are
                      refused, but for enable-admission-plugins, whose entries follow
                      Lodia's; featureGates sets feature-gates.
                    maxProperties: 64
                    type: object
                    x-kubernetes-validations:
                    - message: Lodia sets this flag
                      rule: '!self.exists(k, k in [''advertise-address'', ''allow-privileged'',
                        ''anonymous-auth'', ''authentication-config'', ''authorization-mode'',
                        ''client-ca-file'', ''egress-selector-config-file'', ''enable-bootstrap-token-auth'',
                        ''encryption-provider-config'', ''encryption-provider-config-automatic-reload'',
                        ''endpoint-reconciler-type'', ''etcd-cafile'', ''etcd-certfile'',
                        ''etcd-keyfile'', ''etcd-prefix'', ''etcd-servers'', ''etcd-servers-overrides'',
                        ''feature-gates'', ''goaway-chance'', ''kubelet-client-certificate'',
                        ''kubelet-client-key'', ''kubelet-preferred-address-types'',
                        ''proxy-client-cert-file'', ''proxy-client-key-file'', ''requestheader-allowed-names'',
                        ''requestheader-client-ca-file'', ''requestheader-extra-headers-prefix'',
                        ''requestheader-group-headers'', ''requestheader-username-headers'',
                        ''secure-port'', ''service-account-issuer'', ''service-account-key-file'',
                        ''service-account-signing-endpoint'', ''service-account-signing-key-file'',
                        ''service-cluster-ip-range'', ''shutdown-delay-duration'',
                        ''shutdown-send-retry-after'', ''shutdown-watch-termination-grace-period'',
                        ''tls-cert-file'', ''tls-private-key-file''])'
                  featureGates:
                    additionalProperties:
                      type: boolean
                    description: FeatureGates are passed to kube-apiserver.
                    maxProperties: 64
                    type: object
                  replicas:
                    description: Replicas of the API server; 1 by default, 2 with
                      high availability.
                    format: int32
                    maximum: 5
                    minimum: 1
                    type: integer
                  resources:
                    description: Resources override the operator's defaults.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              controllerManager:
                description: ControllerManager configures kube-controller-manager.
                properties:
                  extraArgs:
                    additionalProperties:
                      type: string
                    description: |-
                      ExtraArgs are flags passed to the component. The flags Lodia sets are
                      refused, but for controllers, whose entries follow Lodia's;
                      featureGates sets feature-gates.
                    maxProperties: 64
                    type: object
                    x-kubernetes-validations:
                    - message: Lodia sets this flag
                      rule: '!self.exists(k, k in [''allocate-node-cidrs'', ''authentication-kubeconfig'',
                        ''authorization-kubeconfig'', ''bind-address'', ''client-ca-file'',
                        ''cluster-cidr'', ''cluster-name'', ''cluster-signing-cert-file'',
                        ''cluster-signing-duration'', ''cluster-signing-key-file'',
                        ''cluster-signing-kubelet-client-cert-file'', ''cluster-signing-kubelet-client-key-file'',
                        ''feature-gates'', ''kubeconfig'', ''leader-elect'', ''leader-elect-lease-duration'',
                        ''leader-elect-renew-deadline'', ''leader-elect-resource-lock'',
                        ''leader-elect-resource-name'', ''leader-elect-resource-namespace'',
                        ''leader-elect-retry-period'', ''node-monitor-grace-period'',
                        ''node-monitor-period'', ''requestheader-client-ca-file'',
                        ''root-ca-file'', ''service-account-private-key-file'', ''service-cluster-ip-range'',
                        ''use-service-account-credentials''])'
                  featureGates:
                    additionalProperties:
                      type: boolean
                    description: FeatureGates are passed to the component.
                    maxProperties: 64
                    type: object
                  resources:
                    description: Resources override the operator's defaults.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              datastore:
                description: Datastore is where the cluster's data lives.
                properties:
                  dedicated:
                    description: Dedicated is an etcd of the tenant's own.
                    properties:
                      className:
                        description: ClassName names a DatastoreClass; empty means
                          the default class.
                        maxLength: 253
                        type: string
                    type: object
                  shared:
                    description: Shared is a prefix in an etcd several tenants share.
                    properties:
                      name:
                        description: Name of the Datastore.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: datastore is immutable in v1alpha1
                  rule: self == oldSelf
                - message: set exactly one of dedicated and shared
                  rule: has(self.dedicated) != has(self.shared)
              endpoint:
                description: Endpoint is how nodes, people and pods reach the API
                  server.
                properties:
                  certSANs:
                    description: CertSANs are extra names on the API server's serving
                      certificate.
                    items:
                      description: |-
                        Hostname is a lowercase DNS name: labels of at most 63 characters, and not
                        digits and dots alone, which read as an IP address.
                      maxLength: 253
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: must be a lowercase DNS name
                        rule: self.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?([.][a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$')
                          && !self.matches('^[0-9.]+$')
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  gateway:
                    description: Gateway attaches routes to a shared Gateway that
                      routes by SNI.
                    properties:
                      hostnames:
                        description: Hostnames are the names routed to this control
                          plane.
                        properties:
                          apiServer:
                            description: APIServer is the public API hostname.
                            maxLength: 253
                            minLength: 1
                            type: string
                            x-kubernetes-validations:
                            - message: must be a lowercase DNS name
                              rule: self.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?([.][a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$')
                                && !self.matches('^[0-9.]+$')
                          konnectivity:
                            description: Konnectivity is where konnectivity agents
                              connect.
                            maxLength: 253
                            minLength: 1
                            type: string
                            x-kubernetes-validations:
                            - message: must be a lowercase DNS name
                              rule: self.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?([.][a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$')
                                && !self.matches('^[0-9.]+$')
                          tunnel:
                            description: |-
                              Tunnel is the hostname apiserver-proxy on every node dials, inside
                              TLS, for the tenant's pods to reach their API server.
                            maxLength: 253
                            minLength: 1
                            type: string
                            x-kubernetes-validations:
                            - message: must be a lowercase DNS name
                              rule: self.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?([.][a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$')
                                && !self.matches('^[0-9.]+$')
                        required:
                        - apiServer
                        - konnectivity
                        - tunnel
                        type: object
                        x-kubernetes-validations:
                        - message: apiServer, konnectivity and tunnel must be three
                            different hostnames
                          rule: self.apiServer != self.konnectivity && (!has(self.tunnel)
                            || self.apiServer != self.tunnel && self.konnectivity
                            != self.tunnel)
                      parentRef:
                        description: ParentRef is the Gateway with a TLS passthrough
                          listener.
                        properties:
                          name:
                            description: Name of the Gateway.
                            maxLength: 253
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace of the Gateway.
                            maxLength: 63
                            minLength: 1
                            type: string
                          sectionName:
                            description: SectionName is the listener's name.
                            maxLength: 253
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                    required:
                    - hostnames
                    - parentRef
                    type: object
                  loadBalancer:
                    description: LoadBalancer creates a Service of type LoadBalancer
                      for this control plane.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: Annotations are added to the Service.
                        maxProperties: 32
                        type: object
                      class:
                        description: Class is the Service's loadBalancerClass.
                        maxLength: 253
                        type: string
                      sourceRanges:
                        description: SourceRanges limit who may connect.
                        items:
                          description: CIDR is an IPv4 or IPv6 network in CIDR notation.
                          maxLength: 43
                          type: string
                          x-kubernetes-validations:
                          - message: must be a network in CIDR notation
                            rule: isCIDR(self)
                        maxItems: 32
                        type: array
                        x-kubernetes-list-type: set
                    type: object
                  nodePort:
                    description: NodePort creates a Service of type NodePort; for
                      development.
                    type: object
                type: object
                x-kubernetes-validations:
                - message: endpoint is immutable in v1alpha1
                  rule: self == oldSelf
                - message: set exactly one of gateway, loadBalancer and nodePort
                  rule: '[has(self.gateway), has(self.loadBalancer), has(self.nodePort)].filter(x,
                    x).size() == 1'
              health:
                description: Health configures how Lodia protects the tenant's workloads.
                properties:
                  holdControllerManager:
                    default: true
                    description: |-
                      HoldControllerManager holds the controller manager's leader lease while
                      most nodes cannot reach the API, so nothing evicts their pods.
                    type: boolean
                type: object
              hibernation:
                description: Hibernation puts the control plane to sleep, keeping
                  its data.
                properties:
                  enabled:
                    description: Enabled overrides the schedules; unset, the schedules
                      decide.
                    type: boolean
                  schedules:
                    description: Schedules put the control plane to sleep at Start
                      and wake it at End.
                    items:
                      description: HibernationSchedule is a pair of cron expressions.
                      properties:
                        end:
                          description: End is a cron expression for waking up.
                          maxLength: 64
                          type: string
                        start:
                          description: Start is a cron expression for falling asleep.
                          maxLength: 64
                          type: string
                        timeZone:
                          description: TimeZone is an IANA time zone; UTC by default.
                          maxLength: 64
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: set start, end or both
                        rule: has(self.start) || has(self.end)
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              highAvailability:
                description: |-
                  HighAvailability runs every component with more than one replica,
                  spread by FailureTolerance, and etcd with three members.
                properties:
                  failureTolerance:
                    description: |-
                      FailureTolerance is Node (replicas on different nodes) or Zone
                      (replicas in different zones). It cannot change once set, since etcd's
                      volumes stay where they were spread; highAvailability can be removed.
                    enum:
                    - Node
                    - Zone
                    type: string
                    x-kubernetes-validations:
                    - message: failureTolerance is immutable once set
                      rule: self == oldSelf
                required:
                - failureTolerance
                type: object
              layout:
                default: Split
                description: |-
                  Layout is Split, a Deployment per component, or Compact, every
                  component in one pod.
                enum:
                - Split
                - Compact
                type: string
                x-kubernetes-validations:
                - message: layout is immutable
                  rule: self == oldSelf
              maintenance:
                description: Maintenance is when Lodia may roll changes it initiates.
                properties:
                  autoUpdate:
                    description: AutoUpdate opts into updates Lodia applies in the
                      window.
                    properties:
                      kubernetesPatch:
                        description: |-
                          KubernetesPatch moves to the newest patch of the running minor that
                          the operator's version table names, in the window.
                        type: boolean
                    type: object
                  window:
                    description: Window is the daily maintenance window; without one,
                      any time.
                    properties:
                      begin:
                        description: Begin is HH:MM.
                        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                        type: string
                      end:
                        description: End is HH:MM.
                        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                        type: string
                      timeZone:
                        description: |-
                          TimeZone is an IANA time zone; UTC by default. One the operator's
                          embedded zone database lacks is TimeZoneUnsupported.
                        maxLength: 64
                        type: string
                    required:
                    - begin
                    - end
                    type: object
                    x-kubernetes-validations:
                    - message: begin and end must differ
                      rule: self.begin != self.end
                type: object
              network:
                description: Network holds the tenant cluster's address ranges.
                properties:
                  clusterDomain:
