---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: kubeconfigrequests.lodia.io
spec:
  group: lodia.io
  names:
    kind: KubeconfigRequest
    listKind: KubeconfigRequestList
    plural: kubeconfigrequests
    shortNames:
    - kcr
    singular: kubeconfigrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.controlPlaneRef.name
      name: ControlPlane
      type: string
    - jsonPath: .spec.user
      name: User
      type: string
    - jsonPath: .spec.access
      name: Access
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.expirationTimestamp
      name: Expires
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KubeconfigRequest asks for a short-lived kubeconfig for a key of the
          requester's own. Lodia answers in status and deletes the request at its
          deadline.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KubeconfigRequestSpec is who asks for access to which ControlPlane, with
              which key, and for how long.
            properties:
              access:
                description: |-
                  Access ClusterAdmin puts the certificate in lodia:cluster-admins, for
                  which the admission policy requires create on
                  controlplanes/adminkubeconfig for the ControlPlane; without it the
                  certificate carries the user only.
                enum:
                - ClusterAdmin
                type: string
              controlPlaneRef:
                description: ControlPlaneRef names a ControlPlane in this namespace.
                properties:
                  name:
                    description: Name of the object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              expirationSeconds:
                default: 3600
                description: ExpirationSeconds counts from the request's creation.
                format: int64
                maximum: 86400
                minimum: 600
                type: integer
              request:
                description: |-
                  Request is a PEM PKCS#10 certificate request, of which Lodia uses the
                  public key only.
                format: byte
                maxLength: 5120
                type: string
                x-kubernetes-validations:
                - message: must be a PEM certificate request, with no private key
                  rule: string(self).startsWith('-----BEGIN CERTIFICATE REQUEST-----')
                    && !string(self).contains('PRIVATE KEY')
              user:
                description: |-
                  User is the requester's own username, which the admission policy
                  KubeconfigRequestPolicy requires; the certificate's user is
                  lodia:user:<user>.
                maxLength: 512
                minLength: 1
                type: string
            required:
            - controlPlaneRef
            - request
            - user
            type: object
            x-kubernetes-validations:
            - message: a KubeconfigRequest cannot change; create another
              rule: self == oldSelf
          status:
            description: |-
              KubeconfigRequestStatus is the issued kubeconfig. The kubeconfig request
              reconciler of the PKI controller writes it.
            properties:
              conditions:
                description: Conditions, Ready among them.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expirationTimestamp:
                description: ExpirationTimestamp is the certificate's NotAfter.
                format: date-time
                type: string
              kubeconfig:
                description: |-
                  Kubeconfig names the public endpoint and the cluster CA bundle and
                  embeds the certificate; it has no key.
                format: byte
                maxLength: 40960
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
