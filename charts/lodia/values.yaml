image:
  repository: ghcr.io/lodia-io/lodia
  tag: ""
  digest: ""

signerImage:
  repository: ghcr.io/lodia-io/lodia-signer
  tag: ""
  digest: ""

tunnelImage:
  repository: ghcr.io/lodia-io/lodia-tunnel
  tag: ""
  digest: ""

crds:
  enabled: true
  keep: true

etcdDruid:
  enabled: true
  image:
    tag: v0.39.2@sha256:8b6313f529cfd1539dbd372756a9ca930ed95aeb5a672864d51ab7ebcfe145db
  operatorConfig:
    leaderElection:
      enabled: true
    controllers:
      etcd:
        enableEtcdSpecAutoReconcile: false
        etcdStatusSyncPeriod: 15s

etcdDruidNamespace: ""
etcdDruidVersion: ""
etcdDruidDeployment: ""
etcdDruidStatusSyncPeriod: ""

health:
  period: 5s
  failuresBeforeFalse: 3
  silentAfter: 20s
  holdFraction: 0.6
  releaseAfter: 2m
  maxNodes: 5000

fleet:
  maxConcurrentRollouts: 5
  maxConcurrentRehearsals: 5

resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    memory: 10Gi

goMemLimit: 9GiB

controllers:
  pki:
    workers: 10
  kubeconfigrequest:
    workers: 10
  datastore:
    workers: 10
  backup:
    workers: 10
  datastore-sample:
    workers: 10
  lifecycle:
    workers: 10
  tenant:
    workers: 10
  health:
    workers: 100
  health-nodes:
    workers: 100
  workloads:
    workers: 10
  rehearsal:
    workers: 10

metrics:
  service:
    enabled: false
  serviceMonitor:
    enabled: false   # needs metrics.service.enabled
    scrapeClass: ""  # required where the Prometheus denies file access through ServiceMonitors or its default scrape class carries an authorization
    labels: {}
  rules:
    enabled: false
    labels: {}
  dashboards:
    enabled: false
    labels:
      grafana_dashboard: "1"
