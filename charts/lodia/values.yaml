image:
  repository: ghcr.io/lodia-io/lodia
  tag: ""
  digest: ""

signerImage:
  repository: ghcr.io/lodia-io/lodia-signer
  tag: ""
  digest: ""

tunnelImage:
  repository: ghcr.io/lodia-io/lodia-tunnel
  tag: ""
  digest: ""

crds:
  enabled: true
  keep: true

etcdDruid:
  enabled: true
  image:
    tag: v0.39.0@sha256:80d2ee4803acf96c46f8f1169772127ac2fb9aee7903a3a27c3af8cd1ad78775
  operatorConfig:
    leaderElection:
      enabled: true
    controllers:
      etcd:
        enableEtcdSpecAutoReconcile: false

etcdDruidNamespace: ""
etcdDruidVersion: ""
etcdDruidDeployment: ""

health:
  period: 5s
  failuresBeforeFalse: 3
  silentAfter: 20s
  holdFraction: 0.6
  releaseAfter: 2m

fleet:
  maxConcurrentRollouts: 5

metrics:
  service:
    enabled: false
  serviceMonitor:
    enabled: false   # needs metrics.service.enabled
    scrapeClass: ""  # required where the Prometheus's default scrape class carries an authorization
    labels: {}
