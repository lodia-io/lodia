apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lodia.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels:
      {{- include "lodia.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lodia.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "lodia.selectorLabels" . | nindent 14 }}
      containers:
        - name: lodia
          image: {{ include "lodia.image" (dict "image" .Values.image "appVersion" .Chart.AppVersion) }}
          args:
            - --signer-image={{ include "lodia.image" (dict "image" .Values.signerImage "appVersion" .Chart.AppVersion) }}
            - --tunnel-image={{ include "lodia.image" (dict "image" .Values.tunnelImage "appVersion" .Chart.AppVersion) }}
            {{- if .Values.etcdDruid.enabled }}
            - --etcd-druid-namespace={{ .Release.Namespace }}
            {{- else }}
            - --etcd-druid-namespace={{ required "etcdDruidNamespace must name the namespace etcd-druid runs in while etcdDruid.enabled is false" .Values.etcdDruidNamespace }}
            {{- end }}
            - --operator-namespace={{ .Release.Namespace }}
            - --config=/etc/lodia/config.yaml
            - --metrics-bind-address=:8443
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8443
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          volumeMounts:
            - name: config
              mountPath: /etc/lodia
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
