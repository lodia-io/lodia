apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lodia.labels" . | nindent 4 }}
data:
  config.yaml: |
    health:
      period: {{ .Values.health.period | quote }}
      failuresBeforeFalse: {{ .Values.health.failuresBeforeFalse }}
      silentAfter: {{ .Values.health.silentAfter | quote }}
      holdFraction: {{ float64 .Values.health.holdFraction }}
      releaseAfter: {{ .Values.health.releaseAfter | quote }}
      maxNodes: {{ int .Values.health.maxNodes }}
    fleet:
      maxConcurrentRollouts: {{ int .Values.fleet.maxConcurrentRollouts }}
