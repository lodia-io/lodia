version: "2"
linters:
  default: none
  enable:
    - kubeapilinter
  settings:
    custom:
      kubeapilinter:
        type: module
        description: Kube API Linter lints Kubernetes API types against the API conventions.
        settings:
          linters:
            enable:
              - nodurations
              - nomaps
              - notimestamp
              - optionalfields
              - requiredfields
            disable:
              # It flags a list of structs that have no required field, and finds two: ClaimValidationRules in authentication_types.go, which is kube-apiserver's JWTAuthenticator field for field and held to it by internal/authnconfig/drift_test.go, and Placement.Tolerations, a false report, since Toleration's rule refuses an empty one and the linter reads no CEL.
              - arrayofstruct
              # Not for CRD types, whose optionality the schema validates: the rules for them are optionalfields and requiredfields (https://github.com/kubernetes-sigs/kube-api-linter/blob/d90122c89087/docs/linters.md?plain=1#L615-L617)
              - nonpointerstructs
          lintersConfig:
            conditions:
              usePatchStrategy: Ignore
              useProtobuf: Ignore
            defaults:
              preferredDefaultMarker: kubebuilder:default
            optionalfields:
              pointers:
                # A pointer where the zero value is a valid choice, a value where the schema refuses it, as the API conventions ask of CRD fields (https://github.com/kubernetes/community/blob/f9a2228599b006184b1ae879c5a11f8ce73c1e7e/contributors/devel/sig-architecture/api-conventions.md?plain=1#L901-L945).
                preference: WhenRequired
  exclusions:
    rules:
      # kube-apiserver's JWTAuthenticator field for field: internal/authnconfig/drift_test.go holds its pointers to upstream's and test/api/authentication_test.go its bounds to what kube-apiserver takes.
      - path: authentication_types\.go
        text: "^(requiredfields|optionalfields):"
        linters:
          - kubeapilinter
      # The linter takes resource.Quantity's zero value as valid and reads no CEL, so it misses the class's rule that refuses a size below twice the quota, a zero size among them (https://github.com/kubernetes-sigs/kube-api-linter/issues/138).
      - path: datastore_types\.go
        text: "^requiredfields: field (DatastoreClass\\.Spec|DatastoreClassSpec\\.Storage|EtcdStorage\\.Size) "
        linters:
          - kubeapilinter
      # The linter takes metav1.Time's zero value as valid and asks for a pointer, but the zero marshals as null, which the schema refuses for a required field, and omitzero leaves it out.
      - path: controlplane_types\.go
        text: "^requiredfields: field (UpgradeStatus\\.StartedAt|RestoreStatus\\.CompletedAt|MemberRestoreStatus\\.DetectedAt) "
        linters:
          - kubeapilinter
      # A gate's value is a bool, not a subobject, and kubeadm and the kubelet take gates as map[string]bool (https://github.com/kubernetes/kubernetes/blob/v1.37.3/cmd/kubeadm/app/apis/kubeadm/v1beta4/types.go#L145).
      - path: controlplane_types\.go
        text: "^nomaps: field (APIServer|Component|Scheduler)\\.FeatureGates "
        linters:
          - kubeapilinter
