subjects:
- kind: ServiceAccount
  name: konnectivity-agent
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: lodia
    k8s-app: konnectivity-agent
  name: konnectivity-agent
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      k8s-app: konnectivity-agent
  template:
    metadata:
      labels:
        k8s-app: konnectivity-agent
    spec:
      containers:
      - command:
        - /proxy-agent
        - --logtostderr=true
        - --ca-cert=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        - --proxy-server-host=api.dev.example.test
        - --proxy-server-port=31132
        - --service-account-token-path=/var/run/secrets/tokens/konnectivity-agent-token
        - --count-server-leases
        - --keepalive-time=30s
        image: registry.k8s.io/kas-network-proxy/proxy-agent:v0.35.1
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8093
          initialDelaySeconds: 15
          periodSeconds: 10
        name: konnectivity-agent
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8093
          periodSeconds: 10
        volumeMounts:
        - mountPath: /var/run/secrets/tokens
          name: konnectivity-agent-token
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      serviceAccountName: konnectivity-agent
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      volumes:
      - name: konnectivity-agent-token
        projected:
          sources:
          - serviceAccountToken:
              audience: system:konnectivity-server
              expirationSeconds: 3600
              path: konnectivity-agent-token
