            memory: 64Mi
        startupProbe:
          failureThreshold: 24
          httpGet:
            path: /healthz
            port: 10257
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 15
        volumeMounts:
        - mountPath: /etc/lodia/kubeconfig
          name: kubeconfig
          readOnly: true
        - mountPath: /etc/lodia/client-ca
          name: client-ca
          readOnly: true
        - mountPath: /etc/lodia/front-proxy-ca
          name: front-proxy-ca
          readOnly: true
        - mountPath: /etc/lodia/kubelet-signer
          name: kubelet-signer
          readOnly: true
        - mountPath: /etc/lodia/ca-bundle
          name: ca-bundle
          readOnly: true
      enableServiceLinks: false
      volumes:
