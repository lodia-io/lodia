---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: controlplanes.lodia.io
spec:
  group: lodia.io
  names:
    kind: ControlPlane
    listKind: ControlPlaneList
    plural: controlplanes
    shortNames:
    - cp
    singular: controlplane
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .status.endpoint.apiServer.host
      name: Endpoint
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ControlPlane is one tenant cluster's control plane: an API server with its
          konnectivity server, a controller manager, a scheduler and a datastore,
          running as pods in this namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ControlPlaneSpec is what the owner of the cluster wants.
            properties:
              addons:
                description: Addons configures what Lodia runs inside the tenant cluster.
                properties:
                  coreDNS:
                    description: CoreDNS configures cluster DNS.
                    properties:
                      enabled:
                        default: true
                        description: Enabled is false when the tenant brings its own
                          DNS.
                        type: boolean
                      replicas:
                        default: 2
                        description: Replicas of CoreDNS.
                        format: int32
                        maximum: 10
                        minimum: 1
                        type: integer
                    type: object
                  konnectivity:
                    description: Konnectivity configures the tunnel between the control
                      plane and the nodes.
                    properties:
                      agent:
                        description: Agent configures the agents in the tenant.
                        properties:
                          mode:
                            default: DaemonSet
                            description: Mode is DaemonSet, an agent per node, or
                              Deployment.
                            enum:
                            - DaemonSet
                            - Deployment
                            type: string
                          replicas:
                            description: Replicas of the Deployment mode.
                            format: int32
                            maximum: 10
                            minimum: 1
                            type: integer
                        type: object
                      version:
                        description: |-
                          Version pins the konnectivity version across a Kubernetes upgrade;
                          empty follows the version table.
                        maxLength: 16
                        pattern: ^v0\.[0-9]+\.[0-9]+$
                        type: string
                    type: object
                  kubeProxy:
                    description: KubeProxy configures kube-proxy.
                    properties:
                      conntrack:
                        description: Conntrack configures kube-proxy's connection
                          tracking.
                        properties:
                          maxPerCore:
                            description: |-
                              MaxPerCore is kube-proxy's conntrack.maxPerCore, the connections tracked
                              per CPU core; 0 leaves the node's nf_conntrack_max as it is. Unset
                              means kube-proxy's default.
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                      enabled:
                        default: true
                        description: Enabled is false for CNIs that replace kube-proxy.
                        type: boolean
                      healthzBindAddress:
                        description: |-
                          HealthzBindAddress is the IP address kube-proxy serves its health port,
                          10256, on: beyond loopback for cloud load balancers; loopback by default.
                        maxLength: 45
                        type: string
                        x-kubernetes-validations:
                        - message: must be an IP address
                          rule: isIP(self)
                      mode:
                        default: iptables
                        description: Mode is iptables, nftables or ipvs.
                        enum:
                        - iptables
                        - nftables
                        - ipvs
                        type: string
                    type: object
                type: object
              apiServer:
                description: APIServer configures kube-apiserver.
                properties:
                  advertiseAddress:
                    description: |-
                      AdvertiseAddress is the address apiserver-proxy owns on every node in
                      gateway mode: 240.0.0.1 by default when the first service range is
                      IPv4, and required when it is IPv6. It cannot change.
                    maxLength: 45
                    type: string
                    x-kubernetes-validations:
                    - message: must be a unicast IP address in canonical form, neither
                        loopback nor link-local
                      rule: isIP(self) && ip.isCanonical(self) && ip(self).isGlobalUnicast()
                  authentication:
                    description: |-
                      Authentication configures structured authentication; the anonymous
                      section is Lodia's.
                    properties:
                      jwt:
                        description: |-
                          JWT are JWT authenticators, kube-apiserver's apiserver.config.k8s.io/v1
                          JWTAuthenticator field for field.
                        items:
                          description: JWTAuthenticator accepts the tokens of one
                            issuer.
                          properties:
                            claimMappings:
                              description: ClaimMappings say which claims become the
                                user.
                              properties:
                                extra:
                                  items:
                                    description: ExtraMapping is an extra attribute
                                      of the user, from a CEL expression.
                                    properties:
                                      key:
                                        maxLength: 512
                                        type: string
                                        x-kubernetes-validations:
                                        - message: must be a lowercase domain-prefixed
                                            path, such as example.org/foo
                                          rule: self.matches(r'^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/[-a-z0-9/._~%!$&\x27()*+,;=:]+$')
                                        - message: k8s.io, kubernetes.io and their
                                            subdomains are reserved
                                          rule: '!self.split(''/'')[0].matches(''(^|[.])(k8s|kubernetes)[.]io$'')'
                                      valueExpression:
                                        maxLength: 2048
                                        minLength: 1
                                        type: string
                                    required:
                                    - key
                                    - valueExpression
                                    type: object
                                  maxItems: 8
                                  type: array
                                  x-kubernetes-list-map-keys:
                                  - key
                                  x-kubernetes-list-type: map
                                groups:
                                  description: PrefixedClaimOrExpression is a claim
                                    with a prefix, or a CEL expression.
                                  properties:
                                    claim:
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                    expression:
                                      maxLength: 2048
                                      minLength: 1
                                      type: string
                                    prefix:
                                      maxLength: 256
                                      type: string
                                  type: object
                                  x-kubernetes-validations:
                                  - message: set at most one of claim and expression
                                    rule: '!(has(self.claim) && has(self.expression))'
                                  - message: prefix is required with claim; it may
                                      be empty
                                    rule: '!has(self.claim) || has(self.prefix)'
                                  - message: prefix is set only with claim
                                    rule: '!has(self.expression) || !has(self.prefix)'
                                uid:
                                  description: ClaimOrExpression is a claim or a CEL
                                    expression.
                                  properties:
                                    claim:
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                    expression:
                                      maxLength: 2048
                                      minLength: 1
                                      type: string
                                  type: object
                                  x-kubernetes-validations:
                                  - message: set at most one of claim and expression
                                    rule: '!(has(self.claim) && has(self.expression))'
                                username:
                                  description: PrefixedClaimOrExpression is a claim
                                    with a prefix, or a CEL expression.
                                  properties:
                                    claim:
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                    expression:
                                      maxLength: 2048
                                      minLength: 1
                                      type: string
                                    prefix:
                                      maxLength: 256
                                      type: string
                                  type: object
                                  x-kubernetes-validations:
                                  - message: set exactly one of claim and expression
                                    rule: has(self.claim) != has(self.expression)
                                  - message: prefix is required with claim; it may
                                      be empty
                                    rule: '!has(self.claim) || has(self.prefix)'
                                  - message: prefix is set only with claim
                                    rule: '!has(self.expression) || !has(self.prefix)'
                              required:
                              - username
                              type: object
                            claimValidationRules:
                              description: |-
                                ClaimValidationRules are claims a token must hold, or CEL expressions on
                                its claims that must be true.
                              items:
                                description: |-
                                  ClaimValidationRule is a claim a token must hold, or a CEL expression on its
                                  claims that must be true.
                                properties:
                                  claim:
                                    maxLength: 253
                                    minLength: 1
                                    type: string
                                  expression:
                                    maxLength: 2048
                                    minLength: 1
                                    type: string
                                  message:
                                    maxLength: 256
                                    type: string
                                  requiredValue:
                                    maxLength: 1024
                                    type: string
                                type: object
                                x-kubernetes-validations:
                                - message: set exactly one of claim and expression
                                  rule: has(self.claim) != has(self.expression)
                                - message: message is set only with expression
                                  rule: '!has(self.claim) || !has(self.message) ||
                                    size(self.message) == 0'
                                - message: requiredValue is set only with claim
                                  rule: '!has(self.expression) || !has(self.requiredValue)
                                    || size(self.requiredValue) == 0'
                              maxItems: 8
                              type: array
                              x-kubernetes-list-type: atomic
                              x-kubernetes-validations:
                              - message: each claim appears once
                                rule: self.all(r, !has(r.claim) || self.exists_one(s,
                                  has(s.claim) && s.claim == r.claim))
                              - message: each expression appears once
                                rule: self.all(r, !has(r.expression) || self.exists_one(s,
                                  has(s.expression) && s.expression == r.expression))
                            issuer:
                              description: Issuer is where the tokens come from and
                                whom they are for.
                              properties:
                                audienceMatchPolicy:
                                  description: AudienceMatchPolicy is MatchAny, required
                                    with more than one audience.
                                  enum:
                                  - ""
                                  - MatchAny
                                  type: string
                                audiences:
                                  description: Audiences are the aud values a token
                                    may carry.
                                  items:
                                    maxLength: 512
                                    minLength: 1
                                    type: string
                                  maxItems: 8
                                  minItems: 1
                                  type: array
                                  x-kubernetes-list-type: set
                                certificateAuthority:
                                  description: |-
                                    CertificateAuthority is the PEM bundle the issuer's serving certificate
                                    is verified against; the API server image's roots when empty.
                                  maxLength: 16384
                                  type: string
                                discoveryURL:
                                  description: |-
                                    DiscoveryURL is where the discovery document is fetched from, when not
                                    under url.
                                  maxLength: 512
                                  type: string
                                  x-kubernetes-validations:
                                  - message: must be an https URL without a user,
                                      a query or a fragment
                                    rule: size(self) == 0 || self.matches('^[hH][tT][tT][pP][sS]://[^/?#@]*([/?#].*)?$')
                                      && !self.matches('[?][^#]') && !self.matches('#.')
                                egressSelectorType:
                                  default: cluster
                                  description: |-
                                    EgressSelectorType is cluster: the API server reaches the issuer
                                    through konnectivity, from the tenant's nodes.
                                  enum:
                                  - ""
                                  - cluster
                                  type: string
                                url:
                                  description: URL is the issuer, the iss claim of
                                    its tokens.
                                  maxLength: 512
                                  type: string
                                  x-kubernetes-validations:
                                  - message: must be an https URL without a user,
                                      a query or a fragment
                                    rule: self.matches('^[hH][tT][tT][pP][sS]://[^/?#@]*([/?#].*)?$')
                                      && !self.matches('[?][^#]') && !self.matches('#.')
                              required:
                              - audiences
                              - url
                              type: object
                              x-kubernetes-validations:
                              - message: audienceMatchPolicy must be MatchAny for
                                  multiple audiences
                                rule: size(self.audiences) == 1 || has(self.audienceMatchPolicy)
                                  && self.audienceMatchPolicy == 'MatchAny'
                              - message: discoveryURL must differ from url
                                rule: '!has(self.discoveryURL) || self.discoveryURL
                                  != self.url'
                            userValidationRules:
                              description: UserValidationRules are CEL expressions
                                on the user that must be true.
                              items:
                                description: UserValidationRule is a CEL expression
                                  on the user that must be true.
                                properties:
                                  expression:
                                    maxLength: 2048
                                    minLength: 1
                                    type: string
                                  message:
                                    maxLength: 256
                                    type: string
                                required:
                                - expression
                                type: object
                              maxItems: 8
                              type: array
                              x-kubernetes-list-map-keys:
                              - expression
                              x-kubernetes-list-type: map
                          required:
                          - claimMappings
                          - issuer
                          type: object
                        maxItems: 8
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: each issuer.url appears once
                          rule: self.all(a, self.exists_one(b, b.issuer.url == a.issuer.url))
                        - message: each issuer.discoveryURL appears once
                          rule: self.all(a, !has(a.issuer.discoveryURL) || size(a.issuer.discoveryURL)
                            == 0 || self.exists_one(b, has(b.issuer.discoveryURL)
                            && b.issuer.discoveryURL == a.issuer.discoveryURL))
                    type: object
                  encryption:
                    description: Encryption configures encryption of Secrets at rest.
                    properties:
                      provider:
                        default: secretbox
                        description: Provider is None, secretbox or aescbc.
                        enum:
                        - None
                        - secretbox
                        - aescbc
                        type: string
                    type: object
                  extraArgs:
                    additionalProperties:
                      type: string
                    description: |-
                      ExtraArgs are flags passed to kube-apiserver, each under its name as
                      kube-apiserver spells it. The flags Lodia sets, those whose defaults it
                      relies on, those that conflict with either and those that end the
                      process are refused, but for enable-admission-plugins, whose entries
                      follow Lodia's; featureGates sets feature-gates.
                    maxProperties: 64
                    type: object
                    x-kubernetes-validations:
                    - message: 'a key must be a flag''s name as the component spells
                        it: lowercase letters and digits in words joined by single
                        dashes'
                      rule: self.all(k, k.matches('^[a-z0-9]+(-[a-z0-9]+)*$'))
                    - message: Lodia sets this flag
                      rule: '!self.exists(k, k in [''advertise-address'', ''allow-privileged'',
                        ''authentication-config'', ''authorization-mode'', ''client-ca-file'',
                        ''egress-selector-config-file'', ''enable-bootstrap-token-auth'',
                        ''encryption-provider-config'', ''encryption-provider-config-automatic-reload'',
                        ''endpoint-reconciler-type'', ''etcd-cafile'', ''etcd-certfile'',
                        ''etcd-keyfile'', ''etcd-servers'', ''feature-gates'', ''goaway-chance'',
                        ''kubelet-client-certificate'', ''kubelet-client-key'', ''kubelet-preferred-address-types'',
                        ''proxy-client-cert-file'', ''proxy-client-key-file'', ''requestheader-allowed-names'',
                        ''requestheader-client-ca-file'', ''requestheader-extra-headers-prefix'',
                        ''requestheader-group-headers'', ''requestheader-username-headers'',
                        ''secure-port'', ''service-account-issuer'', ''service-account-jwks-uri'',
                        ''service-account-signing-endpoint'', ''service-cluster-ip-range'',
                        ''shutdown-delay-duration'', ''shutdown-watch-termination-grace-period'',
                        ''tls-cert-file'', ''tls-private-key-file''])'
                    - message: Lodia relies on this flag's default
                      rule: '!self.exists(k, k in [''bind-address'', ''etcd-prefix'',
                        ''etcd-servers-overrides'', ''shutdown-send-retry-after''])'
                    - message: this flag conflicts with one Lodia sets
                      rule: '!self.exists(k, k in [''admission-control'', ''anonymous-auth'',
                        ''authorization-config'', ''authorization-policy-file'', ''authorization-webhook-cache-authorized-ttl'',
                        ''authorization-webhook-cache-unauthorized-ttl'', ''authorization-webhook-config-file'',
                        ''authorization-webhook-version'', ''cert-dir'', ''service-account-key-file'',
                        ''service-account-signing-key-file''] || k.startsWith(''oidc-''))'
                    - message: this flag makes the component exit, or report another
                        version than the one it runs
                      rule: '!self.exists(k, k in [''help'', ''version''])'
                    - message: disable-admission-plugins is plugin names of letters
                        and digits joined by commas, and nothing else, since kube-apiserver
                        reads it as CSV
                      rule: '!(''disable-admission-plugins'' in self) || self[''disable-admission-plugins''].matches(''^[A-Za-z0-9]+(,[A-Za-z0-9]+)*$'')'
                    - message: disable-admission-plugins cannot name NodeRestriction,
                        which Lodia enables
                      rule: '!(''disable-admission-plugins'' in self) || !self[''disable-admission-plugins''].matches(''(^|,)NodeRestriction(,|$)'')'
                    - message: 'service-account-max-token-expiration is a duration
                        as Go prints it, without its zero units: hours, then minutes
                        and seconds under 60, as 720h or 1h30m'
                      rule: '!(''service-account-max-token-expiration'' in self) ||
                        size(self[''service-account-max-token-expiration'']) > 0 &&
                        self[''service-account-max-token-expiration''].matches(''^([1-9][0-9]*h)?([1-9]m|[1-5][0-9]m)?([1-9]s|[1-5][0-9]s)?$'')'
                    - message: kube-apiserver refuses a service-account-max-token-expiration
                        other than 0 under 1h, and one above 8760h, the longest token
                        lodia-signer signs; 0 means 8760h, so leave the flag out instead
                      rule: '!(''service-account-max-token-expiration'' in self) ||
                        duration(self[''service-account-max-token-expiration'']) >=
                        duration(''1h'') && duration(self[''service-account-max-token-expiration''])
                        <= duration(''8760h'')'
                    - message: event-ttl is a duration as Go's time.ParseDuration
                        reads it, such as 1h30m0s or 3600s
                      rule: '!(''event-ttl'' in self) || self[''event-ttl''].matches(''^[-+]?(0|(([0-9]+([.][0-9]*)?|[.][0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$'')'
                    - message: 'event-ttl is at least 1h, kube-apiserver''s default:
                        an Event''s lease that expires during a restore through deltas
                        aborts it or drops a write (etcd-backup-restore#1045, #1046)'
                      rule: '!(''event-ttl'' in self) || duration(self[''event-ttl''])
                        >= duration(''1h'')'
                  featureGates:
                    additionalProperties:
                      type: boolean
                    description: FeatureGates are passed to kube-apiserver.
                    maxProperties: 64
                    type: object
                    x-kubernetes-validations:
                    - message: kube-apiserver refuses service-account-signing-endpoint,
                        which Lodia sets, without ExternalServiceAccountTokenSigner
                      rule: '!(''ExternalServiceAccountTokenSigner'' in self) || self[''ExternalServiceAccountTokenSigner'']'
                    - message: kube-apiserver refuses the egressSelectorType Lodia
                        renders for every JWT authenticator without StructuredAuthenticationConfigurationEgressSelector
                      rule: '!(''StructuredAuthenticationConfigurationEgressSelector''
                        in self) || self[''StructuredAuthenticationConfigurationEgressSelector'']'
                  replicas:
                    description: Replicas of the API server; 1 by default, 2 with
                      high availability.
                    format: int32
                    maximum: 5
                    minimum: 1
                    type: integer
                  resources:
                    description: Resources override the operator's defaults.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              controllerManager:
                description: ControllerManager configures kube-controller-manager.
                properties:
                  extraArgs:
                    additionalProperties:
                      type: string
                    description: |-
                      ExtraArgs are flags passed to the component, each under its name as the
                      component spells it. The flags Lodia sets, those whose defaults it
                      relies on, those that conflict with either and those that end the
                      process are refused, but for controllers, whose entries follow Lodia's;
                      featureGates sets feature-gates.
                    maxProperties: 64
                    type: object
                    x-kubernetes-validations:
                    - message: 'a key must be a flag''s name as the component spells
                        it: lowercase letters and digits in words joined by single
                        dashes'
                      rule: self.all(k, k.matches('^[a-z0-9]+(-[a-z0-9]+)*$'))
                    - message: Lodia sets this flag
                      rule: '!self.exists(k, k in [''allocate-node-cidrs'', ''authentication-kubeconfig'',
                        ''authorization-kubeconfig'', ''bind-address'', ''client-ca-file'',
                        ''cluster-cidr'', ''cluster-name'', ''cluster-signing-duration'',
                        ''cluster-signing-kubelet-client-cert-file'', ''cluster-signing-kubelet-client-key-file'',
                        ''feature-gates'', ''kubeconfig'', ''leader-elect'', ''leader-elect-lease-duration'',
                        ''leader-elect-renew-deadline'', ''leader-elect-resource-lock'',
                        ''leader-elect-resource-name'', ''leader-elect-resource-namespace'',
                        ''leader-elect-retry-period'', ''node-monitor-grace-period'',
                        ''node-monitor-period'', ''requestheader-client-ca-file'',
                        ''root-ca-file'', ''service-cluster-ip-range'', ''use-service-account-credentials''])'
                    - message: Lodia relies on this flag's default
                      rule: '!self.exists(k, k in [''authorization-always-allow-paths'',
                        ''secure-port''])'
                    - message: this flag conflicts with one Lodia sets
                      rule: '!self.exists(k, k in [''cluster-signing-cert-file'',
                        ''cluster-signing-key-file'', ''master'', ''service-account-private-key-file''])'
                    - message: a node mask size is a positive decimal number without
                        a sign or a leading zero, since kube-controller-manager reads
                        024 as octal and 0 as unset
                      rule: '[''node-cidr-mask-size'', ''node-cidr-mask-size-ipv4'',
                        ''node-cidr-mask-size-ipv6''].all(k, !(k in self) || self[k].matches(''^[1-9][0-9]*$''))'
                    - message: this flag makes the component exit, or report another
                        version than the one it runs
                      rule: '!self.exists(k, k in [''help'', ''version''])'
                  featureGates:
                    additionalProperties:
                      type: boolean
                    description: FeatureGates are passed to the component.
                    maxProperties: 64
                    type: object
                  resources:
                    description: Resources override the operator's defaults.
                    properties:
                      claims:
                        description: |-
