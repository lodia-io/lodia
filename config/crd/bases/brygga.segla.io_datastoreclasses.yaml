                    - Delete
                    - Retain
                    type: string
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Size of each member's volume.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
