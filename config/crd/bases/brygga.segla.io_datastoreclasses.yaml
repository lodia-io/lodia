  names:
    kind: DatastoreClass
    listKind: DatastoreClassList
    plural: datastoreclasses
    shortNames:
    - dsc
    singular: datastoreclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.storage.className
      name: Storage
