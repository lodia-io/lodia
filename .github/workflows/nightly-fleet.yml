name: nightly-fleet

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      tenants:
        description: ControlPlanes in the fleet
        default: "300"
  pull_request:
    paths:
      - .github/workflows/nightly-fleet.yml
      - test/fleet/**

permissions:
  contents: read

jobs:
  fleet:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fleet FLEET_TENANTS="${TENANTS:-300}"
        env:
          TENANTS: ${{ inputs.tenants }}
      - if: always()
        run: cat work/fleet/report.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fleet
          path: work/fleet/
          if-no-files-found: ignore
