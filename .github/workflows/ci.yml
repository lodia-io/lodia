name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-only: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/prometheus.tar.gz" https://github.com/prometheus/prometheus/releases/download/v3.15.1/prometheus-3.15.1.linux-amd64.tar.gz
          echo "6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84  $RUNNER_TEMP/prometheus.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/promtool"
          tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" -C "$RUNNER_TEMP/promtool" --strip-components=1 prometheus-3.15.1.linux-amd64/promtool
          echo "$RUNNER_TEMP/promtool" >> "$GITHUB_PATH"
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/dashboard-linter.tar.gz" https://github.com/grafana/dashboard-linter/releases/download/v0.4.0/dashboard-linter_0.4.0_linux_amd64.tar.gz
          echo "df9a94834b5ea1273a2a79c649f0513913771a81ae25f194dc2244b7f45fef51  $RUNNER_TEMP/dashboard-linter.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/dashboard-linter"
          tar -xzf "$RUNNER_TEMP/dashboard-linter.tar.gz" -C "$RUNNER_TEMP/dashboard-linter" dashboard-linter
          echo "$RUNNER_TEMP/dashboard-linter" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - run: npx --yes --package renovate@44.257.9 -- renovate-config-validator --strict
      - run: make verify
        env:
          LODIA_APISERVER_DUMPS: ${{ runner.temp }}/apiserver-dumps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apiserver-dumps
          path: ${{ runner.temp }}/apiserver-dumps
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: make e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ github.job }}
          path: work/e2e/lodia-e2e-local/_artifacts/
          if-no-files-found: ignore

  e2e-ha:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: make e2e-ha
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ github.job }}
          path: work/e2e/lodia-e2e-local/_artifacts/
          if-no-files-found: ignore

  e2e-restore:
