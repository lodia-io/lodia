name: nightly-restore

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly-restore.yml
      - test/e2e/restore_nightly_test.go

permissions:
  contents: read

jobs:
  restore-through-deltas:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - run: make e2e-restore E2E_RESTORE_TEST=TestOneMemberRestoredThroughDeltas
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ github.job }}
          path: work/e2e/lodia-e2e-local/_artifacts/
          if-no-files-found: ignore
