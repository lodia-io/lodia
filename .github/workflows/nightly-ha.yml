name: nightly-ha

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly-ha.yml
      - test/e2e/ha_nightly_test.go

permissions:
  contents: read

jobs:
  high-availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: make e2e-ha E2E_HA_TEST=TestHighAvailabilityRemovedAndRestored
