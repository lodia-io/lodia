# The tenant's API server and, in the same pod, the konnectivity server it
# reaches the tenant's nodes through. One NodePort Service serves both: the API
# for kubectl and kubelets, the agent port for konnectivity agents.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${CP}-egress-selector
  namespace: ${CP}
data:
  egress-selector.yaml: |
    apiVersion: apiserver.k8s.io/v1beta1
    kind: EgressSelectorConfiguration
    egressSelections:
      - name: cluster
        connection:
          proxyProtocol: GRPC
          transport:
            uds:
              udsName: /run/konnectivity/konnectivity-server.socket
---
apiVersion: v1
kind: Service
metadata:
  name: ${CP}-apiserver
  namespace: ${CP}
spec:
  type: NodePort
  selector: {app: ${CP}-apiserver}
  ports:
    - {name: https, port: ${APISERVER_PORT}, targetPort: ${APISERVER_PORT}, nodePort: ${APISERVER_PORT}}
    - {name: konnectivity, port: 8132, targetPort: 8132, nodePort: ${KONNECTIVITY_PORT}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${CP}-apiserver
  namespace: ${CP}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ${CP}-apiserver}
  template:
    metadata:
      labels: {app: ${CP}-apiserver}
    spec:
      containers:
        - name: kube-apiserver
          image: registry.k8s.io/kube-apiserver:${K8S_VERSION}
          command:
            - kube-apiserver
            - --advertise-address=${MGMT_IP}
            - --secure-port=${APISERVER_PORT}
            - --allow-privileged=true
            - --authorization-mode=Node,RBAC
            - --client-ca-file=/pki/ca.crt
            - --enable-admission-plugins=NodeRestriction
            - --enable-bootstrap-token-auth=true
            - --etcd-servers=https://${CP}-etcd.${CP}.svc:2379
            - --etcd-cafile=/pki/etcd-ca.crt
            - --etcd-certfile=/pki/apiserver-etcd-client.crt
            - --etcd-keyfile=/pki/apiserver-etcd-client.key
            - --egress-selector-config-file=/etc/egress/egress-selector.yaml
            - --kubelet-client-certificate=/pki/apiserver-kubelet-client.crt
            - --kubelet-client-key=/pki/apiserver-kubelet-client.key
            - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
            - --proxy-client-cert-file=/pki/front-proxy-client.crt
            - --proxy-client-key-file=/pki/front-proxy-client.key
            - --requestheader-allowed-names=front-proxy-client
            - --requestheader-client-ca-file=/pki/front-proxy-ca.crt
            - --requestheader-extra-headers-prefix=X-Remote-Extra-
            - --requestheader-group-headers=X-Remote-Group
            - --requestheader-username-headers=X-Remote-User
            - --service-account-issuer=https://kubernetes.default.svc.cluster.local
            - --service-account-key-file=/pki/sa.pub
            - --service-account-signing-key-file=/pki/sa.key
            - --service-cluster-ip-range=${SERVICE_CIDR}
            - --tls-cert-file=/pki/apiserver.crt
            - --tls-private-key-file=/pki/apiserver.key
          ports:
            - {name: https, containerPort: ${APISERVER_PORT}}
          readinessProbe:
            httpGet: {scheme: HTTPS, path: /readyz, port: ${APISERVER_PORT}}
            periodSeconds: 5
          livenessProbe:
            httpGet: {scheme: HTTPS, path: /livez, port: ${APISERVER_PORT}}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 8
          resources:
            requests: {cpu: 100m, memory: 256Mi}
          volumeMounts:
            - {name: pki, mountPath: /pki, readOnly: true}
            - {name: egress, mountPath: /etc/egress, readOnly: true}
            - {name: konnectivity-uds, mountPath: /run/konnectivity}
        - name: konnectivity-server
          image: registry.k8s.io/kas-network-proxy/proxy-server:${KONNECTIVITY_VERSION}
          command:
            - /proxy-server
            - --logtostderr=true
            - --uds-name=/run/konnectivity/konnectivity-server.socket
            - --delete-existing-uds-file=true
            - --server-port=0
            - --mode=grpc
            - --agent-port=8132
            - --admin-port=8133
            - --health-port=8134
            - --cluster-cert=/pki/konnectivity-server.crt
            - --cluster-key=/pki/konnectivity-server.key
            - --kubeconfig=/kubeconfigs/konnectivity-server.conf
            - --agent-namespace=kube-system
            - --agent-service-account=konnectivity-agent
            - --authentication-audience=system:konnectivity-server
            - --proxy-strategies=destHost,default
          ports:
            - {name: agent, containerPort: 8132}
          livenessProbe:
            httpGet: {path: /healthz, port: 8134}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - {name: pki, mountPath: /pki, readOnly: true}
            - {name: kubeconfigs, mountPath: /kubeconfigs, readOnly: true}
            - {name: konnectivity-uds, mountPath: /run/konnectivity}
      volumes:
        - name: pki
          secret: {secretName: ${CP}-pki}
        - name: kubeconfigs
          secret: {secretName: ${CP}-kubeconfigs}
        - name: egress
          configMap: {name: ${CP}-egress-selector}
        - name: konnectivity-uds
          emptyDir: {}
