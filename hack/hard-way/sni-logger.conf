# Spike: does the konnectivity agent send SNI? nginx reads the ClientHello
# without terminating TLS, logs the server name, and passes the stream on.
# A stream session is logged when it ends: restart the agent to see a line.
events {}
stream {
  log_format sni '$remote_addr sni="$ssl_preread_server_name"';
  access_log /dev/stdout sni;
  server {
    listen 443;
    ssl_preread on;
    proxy_pass ${MGMT_IP}:${KONNECTIVITY_PORT};
  }
}
