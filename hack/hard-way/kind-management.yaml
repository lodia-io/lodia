# The management cluster: one kind node that runs the tenant's control plane
# as ordinary pods. The port mapping lets kubectl on the host reach the
# tenant's API server through its NodePort.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 30443
        listenAddress: 127.0.0.1
