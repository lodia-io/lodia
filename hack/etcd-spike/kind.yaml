# The spike's cluster: one kind node for etcd-druid, the tenant's etcd, the
# object store and an API server on top. The port mapping lets kubectl on the
# host reach that API server through its NodePort.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 31443
        hostPort: 31443
        listenAddress: 127.0.0.1
