# What a dedicated etcd looks like. Cluster-scoped, written by the operator
# of the management cluster; a ControlPlane only names the class. The member
# count comes from the ControlPlane (1, or 3 with highAvailability).
apiVersion: lodia.io/v1alpha1
kind: DatastoreClass
metadata:
  name: fast-ssd
  annotations:
    lodia.io/is-default-class: "true"
spec:
  etcd:                                   # rendered into an etcd-druid Etcd resource
    quotaBackendBytes: 4Gi
    autoCompaction: {mode: periodic, retention: 15m}
    defragmentation:
      schedule: "0 3 * * *"               # followers first, leader last
    resources:
      requests: {cpu: 30m, memory: 150M}  # Gardener's shoot defaults until phase 1 measures ours
      limits: {memory: 2Gi}
  storage:
    className: local-nvme
    size: 20Gi
    reclaimPolicy: Retain                 # Delete | Retain, for the volumes of a deleted ControlPlane
  backup:
    store:
      provider: S3                        # S3 | GCS | ABS | Swift, as etcd-druid supports
      bucket: lodia-backups
      # a tenant's snapshots go under prod/<namespace UID>/controlplanes/<ControlPlane UID>
      prefix: prod                        # neither containing v1/ nor ending in v1
      region: eu-central-1
      endpoint: https://s3.eu-central-1.amazonaws.com
      secretRef: {name: s3-backups, namespace: lodia-system}
    fullSnapshotSchedule: "0 */24 * * *"  # the hour is randomised inside the tenant's maintenance window
    deltaSnapshotPeriod: 5m
    retention:
      fullSnapshots: 30                   # each with the deltas after it: 30 days at one a day
      afterDelete: 720h                   # how long snapshots outlive their ControlPlane; not deleted by any release yet
  placement:
    nodeSelector: {node-role.example.com/control-planes: "true"}
