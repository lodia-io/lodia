# A sealed copy of a tenant's etcd, kept in the DatastoreClass's backup store
# under a prefix of its own that nothing writes again. A new ControlPlane with
# spec.restoreFrom.backupRef pointing at it replaces prod-eu: it serves the
# copy's data from the start, and runs its controller manager once released
# and prod-eu is gone.
apiVersion: lodia.io/v1alpha1
kind: Backup
metadata:
  name: prod-eu-before-migration
  namespace: team-a
spec:
  controlPlaneRef: {name: prod-eu}
