# An on-demand full snapshot of a tenant's etcd, kept in the DatastoreClass's
# backup store. A new ControlPlane with spec.restoreFrom.backupRef pointing at
# it starts as a clone.
apiVersion: lodia.io/v1alpha1
kind: Backup
metadata:
  name: prod-eu-before-migration
  namespace: team-a
spec:
  controlPlaneRef: {name: prod-eu}
