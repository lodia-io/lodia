# A person asks for an hour of cluster-admin access with a key of their own;
# request is the base64 of a PEM PKCS#10 request for it, here a P-256 key's
# from openssl req -new. The admission policy admits it only from the user
# serhii, with create on controlplanes/adminkubeconfig for prod-eu. The PKI
# controller answers in status and deletes the request an hour after its
# creation.
apiVersion: lodia.io/v1alpha1
kind: KubeconfigRequest
metadata:
  name: serhii-2026-10-23
  namespace: team-a
spec:
  controlPlaneRef: {name: prod-eu}
  user: serhii                         # the requester; the certificate's user is lodia:user:serhii
  access: ClusterAdmin                 # the certificate's group is lodia:cluster-admins
  request: 
  expirationSeconds: 3600
# status:
#   kubeconfig: <base64>                # the public endpoint, the cluster CA bundle and the certificate; no key
#   expirationTimestamp: "2026-10-23T15:04:05Z"
#   conditions:
#     - {type: Ready, status: "True", reason: Issued}
