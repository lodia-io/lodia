# A person asks for an hour of access. The PKI controller issues a client
# certificate with that lifetime and writes a kubeconfig into a Secret named
# in status; both vanish after expiry.
apiVersion: lodia.io/v1alpha1
kind: KubeconfigRequest
metadata:
  name: serhii-2026-10-23
  namespace: team-a
spec:
  controlPlaneRef: {name: prod-eu}
  user: serhii                         # the certificate's CN
  groups: ["lodia:cluster-admins"]    # the certificate's O; default
  expirationSeconds: 3600
# status:
#   secretRef: {name: prod-eu-kubeconfig-serhii-2026-10-23}
#   expirationTimestamp: "2026-10-23T15:04:05Z"
