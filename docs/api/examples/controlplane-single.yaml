# The smallest ControlPlane: one replica of everything, a dedicated etcd from
# the default DatastoreClass, exposed through a LoadBalancer Service.
apiVersion: brygga.segla.io/v1alpha1
kind: ControlPlane
metadata:
  name: dev
  namespace: team-a
spec:
  version: v1.37.1
  datastore:
    dedicated: {}
  endpoint:
    loadBalancer: {}
  network:
    serviceCIDRs: [10.96.0.0/16]
    podCIDRs: [10.244.0.0/16]
