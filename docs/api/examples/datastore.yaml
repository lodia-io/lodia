# A shared etcd several ControlPlanes use by key prefix: for development
# fleets and density. There is no quota per tenant in a shared store, and a
# slow tenant slows its neighbours; the Datastore says so in its description.
apiVersion: lodia.io/v1alpha1
kind: Datastore
metadata:
  name: pool-a
spec:
  endpoints:
    - https://etcd-0.pool-a.etcd.svc:2379
    - https://etcd-1.pool-a.etcd.svc:2379
    - https://etcd-2.pool-a.etcd.svc:2379
  tls:
    caSecretRef: {name: pool-a-ca, namespace: etcd}
    rootClientSecretRef: {name: pool-a-root, namespace: etcd}   # Lodia creates a user and a role per tenant with it
  prefix: /lodia                     # a tenant lives under /lodia/<namespace>/<name>/
