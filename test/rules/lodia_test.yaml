rule_files:
  - ../../charts/lodia/files/rules/lodia.yaml

evaluation_interval: 30s

tests:
  - name: 'LodiaOperatorDown fires on a standby''s 0 alone'
    interval: 30s
    input_series:
      - series: 'leader_election_master_status{job="lodia",namespace="lodia-system",pod="lodia-b",instance="10.0.0.2:8443",name="lodia.io"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 4m30s
        alertname: LodiaOperatorDown
      - eval_time: 5m
        alertname: LodiaOperatorDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: &a1
              runbook_url: 'https://github.com/lodia-io/lodia/blob/main/docs/operations.md#lodiaoperatordown'
              summary: 'No replica of Lodia has led for 5 minutes, so nothing reconciles the tenants.'

  - name: 'LodiaOperatorDown fires with no series at all'
    interval: 30s
    input_series:
      - series: 'lodia_fleet_max_concurrent_rollouts{job="lodia",namespace="lodia-system",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '5x20'
    alert_rule_test:
      - eval_time: 4m30s
        alertname: LodiaOperatorDown
      - eval_time: 5m
        alertname: LodiaOperatorDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: *a1

  - name: 'LodiaOperatorDown stays silent while the first replica leads'
    interval: 30s
    input_series:
      - series: 'leader_election_master_status{job="lodia",namespace="lodia-system",pod="lodia-a",instance="10.0.0.1:8443",name="lodia.io"}'
        values: '1x20'
      - series: 'leader_election_master_status{job="lodia",namespace="lodia-system",pod="lodia-b",instance="10.0.0.2:8443",name="lodia.io"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: LodiaOperatorDown
      - eval_time: 10m
        alertname: LodiaOperatorDown

  - name: 'LodiaOperatorDown stays silent while the second replica leads'
    interval: 30s
    input_series:
      - series: 'leader_election_master_status{job="lodia",namespace="lodia-system",pod="lodia-a",instance="10.0.0.1:8443",name="lodia.io"}'
        values: '0x20'
      - series: 'leader_election_master_status{job="lodia",namespace="lodia-system",pod="lodia-b",instance="10.0.0.2:8443",name="lodia.io"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: LodiaOperatorDown
      - eval_time: 10m
        alertname: LodiaOperatorDown

  - name: 'LodiaOperatorDown stays silent through 210 seconds without a leader between two'
    interval: 30s
    input_series:
      - series: 'leader_election_master_status{job="lodia",namespace="lodia-system",pod="lodia-a",instance="10.0.0.1:8443",name="lodia.io"}'
        values: '1x10 stale'
      - series: 'leader_election_master_status{job="lodia",namespace="lodia-system",pod="lodia-b",instance="10.0.0.2:8443",name="lodia.io"}'
        values: '0x17 1x20'
    alert_rule_test:
      - eval_time: 5m30s
        alertname: LodiaOperatorDown
      - eval_time: 8m30s
        alertname: LodiaOperatorDown
      - eval_time: 9m
        alertname: LodiaOperatorDown
      - eval_time: 15m
        alertname: LodiaOperatorDown

  - name: 'LodiaOperatorDown keeps firing for 4 minutes after a leader returns'
    interval: 30s
    input_series:
      - series: 'leader_election_master_status{job="lodia",namespace="lodia-system",pod="lodia-a",instance="10.0.0.1:8443",name="lodia.io"}'
        values: '_x20 1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: LodiaOperatorDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: *a1
      - eval_time: 10m
        alertname: LodiaOperatorDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: *a1
      - eval_time: 13m30s
        alertname: LodiaOperatorDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: *a1
      - eval_time: 14m
        alertname: LodiaOperatorDown

  - name: 'LodiaControlPlaneNotReady on each side of its exclusions'
    interval: 30s
    input_series:
      - series: 'lodia_controlplane_condition{job="lodia",namespace="tenants",controlplane="unknown",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",status="True"}'
        values: '0x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="unknown",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",reason="Reconciling"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition{job="lodia",namespace="tenants",controlplane="conflict",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",status="True"}'
        values: '0x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="conflict",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",reason="HostnameConflict"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="conflict",pod="lodia-a",instance="10.0.0.1:8443",type="ControllersLeading",reason="Leading"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition{job="lodia",namespace="tenants",controlplane="held-ca",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",status="True"}'
        values: '0x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="held-ca",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",reason="CAExpired"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="held-ca",pod="lodia-a",instance="10.0.0.1:8443",type="ControllersLeading",reason="AwaitingRelease"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition{job="lodia",namespace="tenants",controlplane="held",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",status="True"}'
        values: '0x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="held",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",reason="AwaitingRelease"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="held",pod="lodia-a",instance="10.0.0.1:8443",type="ControllersLeading",reason="AwaitingRelease"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition{job="lodia",namespace="tenants",controlplane="source",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",status="True"}'
        values: '0x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="source",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",reason="SourceExists"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="source",pod="lodia-a",instance="10.0.0.1:8443",type="ControllersLeading",reason="SourceExists"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition{job="lodia",namespace="tenants",controlplane="held-conflict",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",status="True"}'
        values: '0x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="held-conflict",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",reason="HostnameConflict"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="held-conflict",pod="lodia-a",instance="10.0.0.1:8443",type="ControllersLeading",reason="AwaitingRelease"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition{job="lodia",namespace="tenants",controlplane="source-conflict",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",status="True"}'
        values: '0x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="source-conflict",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",reason="HostnameConflict"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="source-conflict",pod="lodia-a",instance="10.0.0.1:8443",type="ControllersLeading",reason="SourceExists"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition{job="lodia",namespace="tenants",controlplane="deleting",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",status="True"}'
        values: '0x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="deleting",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",reason="Deleting"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition{job="lodia",namespace="tenants",controlplane="paused",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",status="True"}'
        values: '0x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="paused",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",reason="Unavailable"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="paused",pod="lodia-a",instance="10.0.0.1:8443",type="Progressing",reason="Paused"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition{job="lodia",namespace="tenants",controlplane="ready",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",status="True"}'
        values: '1x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="ready",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",reason="Ready"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 9m30s
        alertname: LodiaControlPlaneNotReady
      - eval_time: 10m
        alertname: LodiaControlPlaneNotReady
        exp_alerts:
          - exp_labels:
              controlplane: conflict
              job: lodia
              namespace: tenants
              severity: critical
            exp_annotations: &a2
              runbook_url: 'https://github.com/lodia-io/lodia/blob/main/docs/operations.md#lodiacontrolplanenotready'
              summary: 'ControlPlane tenants/conflict has not been Ready for 10 minutes.'
          - exp_labels:
              controlplane: held-ca
              job: lodia
              namespace: tenants
              severity: critical
            exp_annotations: &a3
              runbook_url: 'https://github.com/lodia-io/lodia/blob/main/docs/operations.md#lodiacontrolplanenotready'
              summary: 'ControlPlane tenants/held-ca has not been Ready for 10 minutes.'
          - exp_labels:
              controlplane: unknown
              job: lodia
              namespace: tenants
              severity: critical
            exp_annotations: &a4
              runbook_url: 'https://github.com/lodia-io/lodia/blob/main/docs/operations.md#lodiacontrolplanenotready'
              summary: 'ControlPlane tenants/unknown has not been Ready for 10 minutes.'

  - name: 'LodiaControlPlaneNotReady fires throughout a failover'
    interval: 30s
    input_series:
      - series: 'lodia_controlplane_condition{job="lodia",namespace="tenants",controlplane="a",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",status="True"}'
        values: '0x30 stale'
      - series: 'lodia_controlplane_condition{job="lodia",namespace="tenants",controlplane="a",pod="lodia-b",instance="10.0.0.2:8443",type="Ready",status="True"}'
        values: '_x38 0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: LodiaControlPlaneNotReady
        exp_alerts:
          - exp_labels:
              controlplane: a
              job: lodia
              namespace: tenants
              severity: critical
            exp_annotations: &a5
              runbook_url: 'https://github.com/lodia-io/lodia/blob/main/docs/operations.md#lodiacontrolplanenotready'
              summary: 'ControlPlane tenants/a has not been Ready for 10 minutes.'
      - eval_time: 15m30s
        alertname: LodiaControlPlaneNotReady
        exp_alerts:
          - exp_labels:
              controlplane: a
              job: lodia
              namespace: tenants
              severity: critical
            exp_annotations: *a5
      - eval_time: 18m30s
        alertname: LodiaControlPlaneNotReady
        exp_alerts:
          - exp_labels:
              controlplane: a
              job: lodia
              namespace: tenants
              severity: critical
            exp_annotations: *a5
      - eval_time: 19m
        alertname: LodiaControlPlaneNotReady
        exp_alerts:
          - exp_labels:
              controlplane: a
              job: lodia
              namespace: tenants
              severity: critical
            exp_annotations: *a5

  - name: 'LodiaControlPlaneNotReady starts its for again after a failover drops it pending'
    interval: 30s
    input_series:
      - series: 'lodia_controlplane_condition{job="lodia",namespace="tenants",controlplane="a",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",status="True"}'
        values: '0x10 stale'
      - series: 'lodia_controlplane_condition{job="lodia",namespace="tenants",controlplane="a",pod="lodia-b",instance="10.0.0.2:8443",type="Ready",status="True"}'
        values: '_x18 0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: LodiaControlPlaneNotReady
      - eval_time: 18m30s
        alertname: LodiaControlPlaneNotReady
      - eval_time: 19m
        alertname: LodiaControlPlaneNotReady
        exp_alerts:
          - exp_labels:
              controlplane: a
              job: lodia
              namespace: tenants
              severity: critical
            exp_annotations: *a5

  - name: 'LodiaControlPlaneDeletionStuck at its for, and never while paused'
    interval: 30s
    input_series:
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="deleting",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",reason="Deleting"}'
        values: '1x70'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="paused",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",reason="Deleting"}'
        values: '1x70'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="paused",pod="lodia-a",instance="10.0.0.1:8443",type="Progressing",reason="Paused"}'
        values: '1x70'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="ready",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",reason="Ready"}'
        values: '1x70'
    alert_rule_test:
      - eval_time: 29m30s
        alertname: LodiaControlPlaneDeletionStuck
      - eval_time: 30m
        alertname: LodiaControlPlaneDeletionStuck
        exp_alerts:
          - exp_labels:
              controlplane: deleting
              job: lodia
              namespace: tenants
              severity: warning
            exp_annotations: &a6
              runbook_url: 'https://github.com/lodia-io/lodia/blob/main/docs/operations.md#lodiacontrolplanedeletionstuck'
              summary: 'ControlPlane tenants/deleting has been deleting for 30 minutes.'

  - name: 'LodiaControlPlaneDeletionStuck fires throughout a failover'
    interval: 30s
    input_series:
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="a",pod="lodia-a",instance="10.0.0.1:8443",type="Ready",reason="Deleting"}'
        values: '1x60 stale'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="a",pod="lodia-b",instance="10.0.0.2:8443",type="Ready",reason="Deleting"}'
        values: '_x68 1x20'
    alert_rule_test:
      - eval_time: 30m
        alertname: LodiaControlPlaneDeletionStuck
        exp_alerts:
          - exp_labels:
              controlplane: a
              job: lodia
              namespace: tenants
              severity: warning
            exp_annotations: &a7
              runbook_url: 'https://github.com/lodia-io/lodia/blob/main/docs/operations.md#lodiacontrolplanedeletionstuck'
              summary: 'ControlPlane tenants/a has been deleting for 30 minutes.'
      - eval_time: 30m30s
        alertname: LodiaControlPlaneDeletionStuck
        exp_alerts:
          - exp_labels:
              controlplane: a
              job: lodia
              namespace: tenants
              severity: warning
            exp_annotations: *a7
      - eval_time: 33m30s
        alertname: LodiaControlPlaneDeletionStuck
        exp_alerts:
          - exp_labels:
              controlplane: a
              job: lodia
              namespace: tenants
              severity: warning
            exp_annotations: *a7
      - eval_time: 34m
        alertname: LodiaControlPlaneDeletionStuck
        exp_alerts:
          - exp_labels:
              controlplane: a
              job: lodia
              namespace: tenants
              severity: warning
            exp_annotations: *a7

  - name: 'LodiaRedundancyLost on each side of its thresholds and exclusions'
    interval: 30s
    input_series:
      - series: 'lodia_controlplane_component_replicas{job="lodia",namespace="tenants",controlplane="api",pod="lodia-a",instance="10.0.0.1:8443",component="apiServer"}'
        values: '3x40'
      - series: 'lodia_controlplane_component_replicas_ready{job="lodia",namespace="tenants",controlplane="api",pod="lodia-a",instance="10.0.0.1:8443",component="apiServer"}'
        values: '2x40'
      - series: 'lodia_controlplane_datastore_members{job="lodia",namespace="tenants",controlplane="api",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '3x40'
      - series: 'lodia_controlplane_datastore_members_ready{job="lodia",namespace="tenants",controlplane="api",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '3x40'
      - series: 'lodia_controlplane_component_replicas{job="lodia",namespace="tenants",controlplane="etcd",pod="lodia-a",instance="10.0.0.1:8443",component="apiServer"}'
        values: '3x40'
      - series: 'lodia_controlplane_component_replicas_ready{job="lodia",namespace="tenants",controlplane="etcd",pod="lodia-a",instance="10.0.0.1:8443",component="apiServer"}'
        values: '3x40'
      - series: 'lodia_controlplane_datastore_members{job="lodia",namespace="tenants",controlplane="etcd",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '3x40'
      - series: 'lodia_controlplane_datastore_members_ready{job="lodia",namespace="tenants",controlplane="etcd",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '2x40'
      - series: 'lodia_controlplane_component_replicas{job="lodia",namespace="tenants",controlplane="single",pod="lodia-a",instance="10.0.0.1:8443",component="apiServer"}'
        values: '1x40'
      - series: 'lodia_controlplane_component_replicas_ready{job="lodia",namespace="tenants",controlplane="single",pod="lodia-a",instance="10.0.0.1:8443",component="apiServer"}'
        values: '0x40'
      - series: 'lodia_controlplane_datastore_members{job="lodia",namespace="tenants",controlplane="single",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '1x40'
      - series: 'lodia_controlplane_datastore_members_ready{job="lodia",namespace="tenants",controlplane="single",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '1x40'
      - series: 'lodia_controlplane_component_replicas{job="lodia",namespace="tenants",controlplane="quorum",pod="lodia-a",instance="10.0.0.1:8443",component="apiServer"}'
        values: '3x40'
      - series: 'lodia_controlplane_component_replicas_ready{job="lodia",namespace="tenants",controlplane="quorum",pod="lodia-a",instance="10.0.0.1:8443",component="apiServer"}'
        values: '3x40'
      - series: 'lodia_controlplane_datastore_members{job="lodia",namespace="tenants",controlplane="quorum",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '3x40'
      - series: 'lodia_controlplane_datastore_members_ready{job="lodia",namespace="tenants",controlplane="quorum",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '1x40'
      - series: 'lodia_controlplane_component_replicas{job="lodia",namespace="tenants",controlplane="held",pod="lodia-a",instance="10.0.0.1:8443",component="controllerManager"}'
        values: '0x40'
      - series: 'lodia_controlplane_component_replicas_ready{job="lodia",namespace="tenants",controlplane="held",pod="lodia-a",instance="10.0.0.1:8443",component="controllerManager"}'
        values: '0x40'
      - series: 'lodia_controlplane_datastore_members{job="lodia",namespace="tenants",controlplane="held",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '1x40'
      - series: 'lodia_controlplane_datastore_members_ready{job="lodia",namespace="tenants",controlplane="held",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '1x40'
      - series: 'lodia_controlplane_component_replicas{job="lodia",namespace="tenants",controlplane="full",pod="lodia-a",instance="10.0.0.1:8443",component="apiServer"}'
        values: '3x40'
      - series: 'lodia_controlplane_component_replicas_ready{job="lodia",namespace="tenants",controlplane="full",pod="lodia-a",instance="10.0.0.1:8443",component="apiServer"}'
        values: '3x40'
      - series: 'lodia_controlplane_component_replicas{job="lodia",namespace="tenants",controlplane="full",pod="lodia-a",instance="10.0.0.1:8443",component="scheduler"}'
        values: '2x40'
      - series: 'lodia_controlplane_component_replicas_ready{job="lodia",namespace="tenants",controlplane="full",pod="lodia-a",instance="10.0.0.1:8443",component="scheduler"}'
        values: '2x40'
      - series: 'lodia_controlplane_datastore_members{job="lodia",namespace="tenants",controlplane="full",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '3x40'
      - series: 'lodia_controlplane_datastore_members_ready{job="lodia",namespace="tenants",controlplane="full",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '3x40'
      - series: 'lodia_controlplane_component_replicas{job="lodia",namespace="tenants",controlplane="paused",pod="lodia-a",instance="10.0.0.1:8443",component="apiServer"}'
        values: '3x40'
      - series: 'lodia_controlplane_component_replicas_ready{job="lodia",namespace="tenants",controlplane="paused",pod="lodia-a",instance="10.0.0.1:8443",component="apiServer"}'
        values: '2x40'
      - series: 'lodia_controlplane_datastore_members{job="lodia",namespace="tenants",controlplane="paused",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '3x40'
      - series: 'lodia_controlplane_datastore_members_ready{job="lodia",namespace="tenants",controlplane="paused",pod="lodia-a",instance="10.0.0.1:8443"}'
        values: '2x40'
      - series: 'lodia_controlplane_condition_reason{job="lodia",namespace="tenants",controlplane="paused",pod="lodia-a",instance="10.0.0.1:8443",type="Progressing",reason="Paused"}'
        values: '1x40'
      - series: 'lodia_controlplane_component_replicas{job="lodia",namespace="tenants",controlplane="deleting",pod="lodia-a",instance="10.0.0.1:8443",component="apiServer"}'
        values: '3x40'
      - series: 'lodia_controlplane_component_replicas_ready{job="lodia",namespace="tenants",controlplane="deleting",pod="lodia-a",instance="10.0.0.1:8443",component="apiServer"}'
